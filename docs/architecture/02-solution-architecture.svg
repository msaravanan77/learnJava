<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <!-- Title -->
  <text x="700" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Solution Architecture - Workspace Intelligence System
  </text>
  <text x="700" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">
    End-to-End Flow: Code Indexing → Embedding → Search → AI Completion
  </text>

  <!-- Left: Developer Workspace -->
  <rect x="50" y="100" width="250" height="650" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="5"/>
  <text x="175" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Developer Workspace</text>

  <!-- IDE -->
  <rect x="80" y="160" width="190" height="80" fill="#3498db" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="175" y="190" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">IDE (VSCode/IntelliJ)</text>
  <text x="175" y="210" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• Code Editor</text>
  <text x="175" y="225" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">• LSP Client</text>

  <!-- Local Files -->
  <rect x="80" y="260" width="190" height="70" fill="#16a085" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="175" y="285" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Workspace Files</text>
  <text x="175" y="305" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Java, Python, TypeScript</text>
  <text x="175" y="320" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Functions, Classes, Modules</text>

  <!-- Developer Actions -->
  <rect x="80" y="350" width="190" height="100" fill="#e67e22" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="175" y="375" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">Developer Actions</text>
  <text x="175" y="395" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">1. Write Code</text>
  <text x="175" y="410" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">2. Request Completion</text>
  <text x="175" y="425" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">3. Search Codebase</text>
  <text x="175" y="440" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">4. Ask Questions</text>

  <!-- Arrow to Cloud -->
  <path d="M 300 200 L 380 200" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="340" y="190" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">HTTPS/WSS</text>

  <!-- Center: Cloud Platform -->
  <rect x="380" y="100" width="640" height="650" fill="#ffffff" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="700" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">Cloud Platform (AWS/GCP/Azure)</text>

  <!-- API Gateway -->
  <rect x="420" y="150" width="560" height="80" fill="#e74c3c" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="700" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">API Gateway + Load Balancer</text>
  <rect x="450" y="185" width="130" height="30" fill="#c0392b" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="515" y="205" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Auth (JWT/OAuth)</text>
  <rect x="595" y="185" width="110" height="30" fill="#c0392b" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="650" y="205" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Rate Limiting</text>
  <rect x="720" y="185" width="110" height="30" fill="#c0392b" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="775" y="205" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">CORS</text>
  <rect x="845" y="185" width="110" height="30" fill="#c0392b" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="900" y="205" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">Monitoring</text>

  <!-- Processing Pipeline -->
  <text x="480" y="260" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Processing Pipeline:</text>

  <!-- Step 1: Indexing -->
  <rect x="420" y="275" width="170" height="90" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="505" y="295" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">1. Indexing Service</text>
  <text x="505" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Parse code (Tree-sitter)</text>
  <text x="505" y="330" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Extract functions/classes</text>
  <text x="505" y="345" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Build dependency graph</text>
  <text x="505" y="360" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Trigger embedding</text>

  <!-- Arrow -->
  <path d="M 590 320 L 630 320" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Embedding -->
  <rect x="630" y="275" width="170" height="90" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="715" y="295" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">2. Embedding Service</text>
  <text x="715" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Preprocess code</text>
  <text x="715" y="330" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Generate vectors (768D)</text>
  <text x="715" y="345" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• GraphCodeBERT</text>
  <text x="715" y="360" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Batch processing</text>

  <!-- Arrow -->
  <path d="M 800 320 L 840 320" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Step 3: Vector Store -->
  <rect x="840" y="275" width="140" height="90" fill="#f39c12" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="910" y="295" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">3. Vector DB</text>
  <text x="910" y="315" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Qdrant</text>
  <text x="910" y="330" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Store embeddings</text>
  <text x="910" y="345" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• HNSW index</text>
  <text x="910" y="360" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Fast similarity</text>

  <!-- Query Pipeline -->
  <text x="480" y="400" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Query Pipeline:</text>

  <!-- Step 4: Search -->
  <rect x="420" y="415" width="170" height="90" fill="#27ae60" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="505" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">4. Search Service</text>
  <text x="505" y="455" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Semantic search</text>
  <text x="505" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Hybrid search</text>
  <text x="505" y="485" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Re-ranking</text>
  <text x="505" y="500" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Filtering</text>

  <!-- Arrow -->
  <path d="M 590 460 L 630 460" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Step 5: Context Engine -->
  <rect x="630" y="415" width="170" height="90" fill="#16a085" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="715" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">5. Context Engine</text>
  <text x="715" y="455" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Gather relevant code</text>
  <text x="715" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Traverse dependencies</text>
  <text x="715" y="485" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Optimize tokens</text>
  <text x="715" y="500" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Build prompt</text>

  <!-- Arrow -->
  <path d="M 800 460 L 840 460" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Step 6: LLM Service -->
  <rect x="840" y="415" width="140" height="90" fill="#e67e22" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="910" y="435" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">6. LLM Service</text>
  <text x="910" y="455" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Call AI API</text>
  <text x="910" y="470" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Stream response</text>
  <text x="910" y="485" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Cache results</text>
  <text x="910" y="500" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">• Track costs</text>

  <!-- Data Stores -->
  <text x="480" y="540" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">Data Layer:</text>

  <rect x="420" y="555" width="130" height="70" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="485" y="575" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Qdrant</text>
  <text x="485" y="592" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Vector embeddings</text>
  <text x="485" y="607" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Similarity search</text>

  <rect x="570" y="555" width="130" height="70" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="635" y="575" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">PostgreSQL</text>
  <text x="635" y="592" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Metadata</text>
  <text x="635" y="607" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Relationships</text>

  <rect x="720" y="555" width="130" height="70" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="785" y="575" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Redis</text>
  <text x="785" y="592" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Caching layer</text>
  <text x="785" y="607" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Real-time data</text>

  <rect x="870" y="555" width="110" height="70" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="925" y="575" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">S3</text>
  <text x="925" y="592" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">File storage</text>
  <text x="925" y="607" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Backups</text>

  <!-- Monitoring -->
  <rect x="420" y="650" width="280" height="70" fill="#95a5a6" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="560" y="670" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Monitoring & Observability</text>
  <text x="560" y="688" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Prometheus • Grafana • Jaeger</text>
  <text x="560" y="703" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Logs • Metrics • Traces • Alerts</text>

  <!-- Security -->
  <rect x="720" y="650" width="260" height="70" fill="#34495e" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="850" y="670" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Security & Compliance</text>
  <text x="850" y="688" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Encryption • RBAC • Audit Logs</text>
  <text x="850" y="703" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">SOC2 • GDPR • Data Isolation</text>

  <!-- Right: External Services -->
  <rect x="1070" y="100" width="280" height="650" fill="#f8f9fa" stroke="#34495e" stroke-width="2" rx="5"/>
  <text x="1210" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#2c3e50">External AI Services</text>

  <rect x="1100" y="160" width="220" height="60" fill="#9b59b6" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="1210" y="185" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">OpenAI GPT-4</text>
  <text x="1210" y="205" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Code completion & generation</text>

  <rect x="1100" y="240" width="220" height="60" fill="#9b59b6" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="1210" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Anthropic Claude</text>
  <text x="1210" y="285" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Long context understanding</text>

  <rect x="1100" y="320" width="220" height="60" fill="#9b59b6" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="1210" y="345" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Local Models</text>
  <text x="1210" y="365" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">CodeLlama, StarCoder, DeepSeek</text>

  <!-- Connection -->
  <path d="M 980 460 L 1070 270" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5" fill="none" marker-end="url(#arrowhead)"/>

  <!-- CI/CD -->
  <rect x="1100" y="500" width="220" height="80" fill="#1abc9c" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="1210" y="525" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">CI/CD Pipeline</text>
  <text x="1210" y="545" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">GitHub Actions</text>
  <text x="1210" y="560" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Automated Testing</text>
  <text x="1210" y="575" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Deployment Automation</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50" />
    </marker>
  </defs>

  <!-- Key Metrics Box -->
  <rect x="50" y="770" width="1300" height="100" fill="#ecf0f1" stroke="#34495e" stroke-width="2" rx="5"/>
  <text x="700" y="795" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#2c3e50">Key Performance Metrics</text>

  <text x="180" y="820" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">⚡ Indexing: &lt;5 sec/1000 files</text>
  <text x="180" y="840" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">🔍 Search Latency: &lt;100ms p95</text>
  <text x="180" y="860" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">💾 Embedding: &lt;50ms/element</text>

  <text x="520" y="820" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">🤖 Completion: &lt;200ms first token</text>
  <text x="520" y="840" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">📊 Accuracy: &gt;85% acceptance rate</text>
  <text x="520" y="860" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">🌐 Scale: 10,000+ concurrent users</text>

  <text x="900" y="820" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">🛡️ Security: E2E encryption</text>
  <text x="900" y="840" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">📈 Uptime: 99.9% SLA</text>
  <text x="900" y="860" font-family="Arial, sans-serif" font-size="11" fill="#2c3e50">💰 Cost: &lt;$0.01 per query</text>
</svg>