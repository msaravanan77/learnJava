<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000">
  <!-- Title -->
  <text x="700" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Data Flow Sequence Diagram - Code Completion Request
  </text>
  <text x="700" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">
    End-to-End Flow: Developer Types Code → AI Completion Returned
  </text>

  <!-- Actors/Components (vertical lines) -->
  <!-- IDE -->
  <rect x="50" y="100" width="100" height="50" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">IDE</text>
  <line x1="100" y1="150" x2="100" y2="950" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- API Gateway -->
  <rect x="200" y="100" width="100" height="50" fill="#e74c3c" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="250" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">API Gateway</text>
  <line x1="250" y1="150" x2="250" y2="950" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Context Engine -->
  <rect x="350" y="100" width="100" height="50" fill="#16a085" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Context</text>
  <line x1="400" y1="150" x2="400" y2="950" stroke="#16a085" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Search Service -->
  <rect x="500" y="100" width="100" height="50" fill="#27ae60" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="550" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Search</text>
  <line x1="550" y1="150" x2="550" y2="950" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Embedding Service -->
  <rect x="650" y="100" width="100" height="50" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="700" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Embedding</text>
  <line x1="700" y1="150" x2="700" y2="950" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Qdrant -->
  <rect x="800" y="100" width="100" height="50" fill="#f39c12" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="850" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Qdrant</text>
  <line x1="850" y1="150" x2="850" y2="950" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- PostgreSQL -->
  <rect x="950" y="100" width="100" height="50" fill="#f39c12" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="1000" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">PostgreSQL</text>
  <line x1="1000" y1="150" x2="1000" y2="950" stroke="#f39c12" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- LLM Service -->
  <rect x="1100" y="100" width="100" height="50" fill="#e67e22" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="1150" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">LLM</text>
  <line x1="1150" y1="150" x2="1150" y2="950" stroke="#e67e22" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- OpenAI -->
  <rect x="1250" y="100" width="100" height="50" fill="#9b59b6" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="1300" y="130" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">OpenAI</text>
  <line x1="1300" y1="150" x2="1300" y2="950" stroke="#9b59b6" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Sequence Steps -->

  <!-- Step 1: Developer types code -->
  <rect x="30" y="180" width="140" height="40" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="100" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">1. Developer</text>
  <text x="100" y="210" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#2c3e50">types code</text>

  <!-- Step 2: Request completion -->
  <path d="M 100 220 L 250 240" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="175" y="235" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">POST /api/v1/completion</text>
  <rect x="250" y="240" width="10" height="40" fill="#e74c3c"/>
  <text x="260" y="265" font-family="Arial, sans-serif" font-size="9" fill="#e74c3c">2. Validate JWT</text>

  <!-- Step 3: Forward to Context Engine -->
  <path d="M 260 280 L 400 300" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="330" y="295" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">3. Get context</text>
  <rect x="400" y="300" width="10" height="220" fill="#16a085"/>

  <!-- Step 4: Get current file info -->
  <text x="420" y="330" font-family="Arial, sans-serif" font-size="9" fill="#16a085">4. Analyze current file</text>
  <text x="420" y="345" font-family="Arial, sans-serif" font-size="9" fill="#16a085">   cursor position</text>

  <!-- Step 5: Search for similar code -->
  <path d="M 410 360 L 550 380" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="480" y="375" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">5. Search similar code</text>
  <rect x="550" y="380" width="10" height="120" fill="#27ae60"/>

  <!-- Step 6: Embed query -->
  <path d="M 560 400 L 700 420" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="630" y="415" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">6. Embed query</text>
  <rect x="700" y="420" width="10" height="40" fill="#9b59b6"/>
  <text x="720" y="445" font-family="Arial, sans-serif" font-size="9" fill="#9b59b6">Generate 768D vector</text>

  <!-- Step 7: Return embedding -->
  <path d="M 700 460 L 560 480" stroke="#2c3e50" stroke-width="2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="630" y="475" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">7. Vector[768]</text>

  <!-- Step 8: Search Qdrant -->
  <path d="M 560 485 L 850 510" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="705" y="505" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">8. Similarity search</text>
  <rect x="850" y="510" width="10" height="50" fill="#f39c12"/>
  <text x="870" y="535" font-family="Arial, sans-serif" font-size="9" fill="#f39c12">HNSW search</text>
  <text x="870" y="550" font-family="Arial, sans-serif" font-size="9" fill="#f39c12">cosine similarity</text>

  <!-- Step 9: Return results -->
  <path d="M 850 560 L 560 585" stroke="#2c3e50" stroke-width="2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="705" y="577" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">9. Top 10 results</text>

  <!-- Step 10: Return to context -->
  <path d="M 550 590 L 410 610" stroke="#2c3e50" stroke-width="2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="480" y="605" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">10. Similar code</text>

  <!-- Step 11: Query dependencies -->
  <path d="M 410 620 L 1000 650" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="705" y="640" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">11. Get dependencies</text>
  <rect x="1000" y="650" width="10" height="50" fill="#f39c12"/>
  <text x="1020" y="675" font-family="Arial, sans-serif" font-size="9" fill="#f39c12">Query graph</text>

  <!-- Step 12: Return dependencies -->
  <path d="M 1000 700 L 410 730" stroke="#2c3e50" stroke-width="2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="705" y="720" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">12. Related files</text>

  <!-- Step 13: Build context -->
  <text x="420" y="750" font-family="Arial, sans-serif" font-size="9" fill="#16a085">13. Build context:</text>
  <text x="420" y="765" font-family="Arial, sans-serif" font-size="9" fill="#16a085">    • Current file</text>
  <text x="420" y="780" font-family="Arial, sans-serif" font-size="9" fill="#16a085">    • Similar code</text>
  <text x="420" y="795" font-family="Arial, sans-serif" font-size="9" fill="#16a085">    • Dependencies</text>
  <text x="420" y="810" font-family="Arial, sans-serif" font-size="9" fill="#16a085">    • Optimize tokens</text>

  <!-- Step 14: Return context -->
  <path d="M 400 820 L 260 840" stroke="#2c3e50" stroke-width="2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="330" y="835" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">14. Context (3500 tokens)</text>

  <!-- Step 15: Forward to LLM -->
  <path d="M 260 845 L 1150 870" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="705" y="862" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">15. Generate completion</text>
  <rect x="1150" y="870" width="10" height="100" fill="#e67e22"/>

  <!-- Step 16: Call OpenAI -->
  <path d="M 1160 880 L 1300 895" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="1230" y="892" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">16. API call</text>
  <rect x="1300" y="895" width="10" height="40" fill="#9b59b6"/>
  <text x="1320" y="920" font-family="Arial, sans-serif" font-size="9" fill="#9b59b6">GPT-4</text>

  <!-- Step 17: Stream response -->
  <path d="M 1300 935 L 1160 950" stroke="#2c3e50" stroke-width="2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="1230" y="947" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">17. Stream tokens</text>

  <!-- Step 18: Stream to API Gateway -->
  <path d="M 1150 955 L 260 970" stroke="#2c3e50" stroke-width="2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="705" y="967" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">18. Stream response</text>

  <!-- Step 19: Stream to IDE -->
  <path d="M 250 975 L 100 990" stroke="#2c3e50" stroke-width="2" stroke-dasharray="3,3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="175" y="987" font-family="Arial, sans-serif" font-size="9" fill="#2c3e50">19. WebSocket stream</text>

  <!-- Timing annotations -->
  <text x="20" y="225" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">t=0ms</text>
  <text x="20" y="280" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">t=5ms</text>
  <text x="20" y="400" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">t=20ms</text>
  <text x="20" y="620" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">t=50ms</text>
  <text x="20" y="880" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">t=100ms</text>
  <text x="20" y="990" font-family="Arial, sans-serif" font-size="8" fill="#7f8c8d">t=200ms</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50" />
    </marker>
  </defs>
</svg>