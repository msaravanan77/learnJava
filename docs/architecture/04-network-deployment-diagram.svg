  <path d="M 440 550 L 475 1025" stroke="#9b59b6" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
  <path d="M 440 550 L 735 1025" stroke="#9b59b6" stroke-width="2" stroke-dasharray="3,3" fill="none"/>

  <!-- Arrow marker definition -->
