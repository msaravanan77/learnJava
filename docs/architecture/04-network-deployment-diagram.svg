  <text x="1200" y="655" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">(HA setup)</text>

  <rect x="1280" y="590" width="120" height="110" fill="#e67e22" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="1340" y="620" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">LLM</text>
  <text x="1340" y="640" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Replica pods</text>
  <text x="1340" y="655" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">(HA setup)</text>

  <rect x="840" y="740" width="640" height="160" fill="#ffffff" stroke="#9b59b6" stroke-width="2" rx="5"/>
  <text x="870" y="765" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9b59b6">Namespace: ml-services (GPU Node Pool)</text>

  <rect x="860" y="780" width="140" height="100" fill="#9b59b6" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="930" y="820" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Embedding</text>
  <text x="930" y="840" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Replica pods</text>
  <text x="930" y="855" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">(HA setup)</text>

  <rect x="1020" y="780" width="140" height="100" fill="#3498db" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="1090" y="820" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Indexing</text>
  <text x="1090" y="840" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Replica pods</text>
  <text x="1090" y="855" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">(HA setup)</text>

  <rect x="1180" y="780" width="280" height="100" fill="#95a5a6" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="1320" y="820" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="white">Worker Pods (Celery)</text>
  <text x="1320" y="840" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="white">Replica pods (HA setup)</text>

