  <text x="430" y="835" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">CPU: 2 cores</text>
  <text x="430" y="850" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">RAM: 4 GB</text>
  <text x="430" y="865" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Port: 8000</text>

  <rect x="540" y="780" width="200" height="100" fill="#95a5a6" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="640" y="800" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Worker Pods (Celery)</text>
  <text x="640" y="820" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Background job processing</text>
  <text x="640" y="835" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Pod: 5 replicas</text>
  <text x="640" y="850" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">CPU: 1 core, RAM: 2 GB</text>
  <text x="640" y="865" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Auto-scaling based on queue</text>

