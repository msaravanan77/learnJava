<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100">
  <!-- Title -->
  <text x="800" y="30" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Network &amp; Deployment Architecture - Kubernetes
  </text>
  <text x="800" y="55" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#7f8c8d">
    Production Deployment on AWS/GCP/Azure with High Availability
  </text>

  <!-- Internet/Public Zone -->
  <rect x="50" y="100" width="1500" height="150" fill="#e8f4f8" stroke="#3498db" stroke-width="3" rx="5"/>
  <text x="100" y="130" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">🌐 Internet / Public Zone</text>

  <!-- CDN -->
  <rect x="100" y="150" width="200" height="80" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="200" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">CloudFront / CDN</text>
  <text x="200" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Static Assets</text>
  <text x="200" y="210" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Global Distribution</text>
  <text x="200" y="225" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Edge Caching</text>

  <!-- DNS -->
  <rect x="340" y="150" width="200" height="80" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="440" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Route 53 / DNS</text>
  <text x="440" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">DNS Routing</text>
  <text x="440" y="210" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Health Checks</text>
  <text x="440" y="225" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Failover</text>

  <!-- WAF -->
  <rect x="580" y="150" width="200" height="80" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="680" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">WAF / DDoS Protection</text>
  <text x="680" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">AWS Shield</text>
  <text x="680" y="210" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Rate Limiting</text>
  <text x="680" y="225" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">SQL Injection Protection</text>

  <!-- Certificate Manager -->
  <rect x="820" y="150" width="200" height="80" fill="#3498db" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="920" y="175" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Certificate Manager</text>
  <text x="920" y="195" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">SSL/TLS Certificates</text>
  <text x="920" y="210" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">Auto Renewal</text>
  <text x="920" y="225" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">api.yourcompany.com</text>

  <!-- Connection arrows -->
  <path d="M 440 230 L 440 280" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Load Balancer Zone -->
  <rect x="50" y="280" width="1500" height="100" fill="#fef5e7" stroke="#f39c12" stroke-width="3" rx="5"/>
  <text x="100" y="310" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">⚖️ Load Balancer / DMZ</text>

  <rect x="200" y="320" width="1200" height="50" fill="#f39c12" stroke="#2c3e50" stroke-width="2" rx="5"/>
  <text x="800" y="340" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Application Load Balancer (ALB) - Multi-AZ</text>
  <text x="800" y="358" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="white">HTTPS (443) • WebSocket (WSS) • Health Checks • Sticky Sessions • SSL Termination</text>

  <!-- Connection arrows -->
  <path d="M 800 370 L 800 420" stroke="#2c3e50" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- VPC / Kubernetes Cluster -->
  <rect x="50" y="420" width="1500" height="530" fill="#e8f8f0" stroke="#27ae60" stroke-width="3" rx="5"/>
  <text x="100" y="450" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">☸️ Kubernetes Cluster (EKS/GKE/AKS) - VPC: 10.0.0.0/16</text>

  <!-- Availability Zone 1 -->
  <rect x="100" y="480" width="680" height="440" fill="#d5f4e6" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,5" rx="5"/>
  <text x="130" y="510" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#27ae60">Availability Zone A (us-east-1a)</text>
  <text x="130" y="530" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Subnet: 10.0.1.0/24 (Private)</text>

  <!-- Namespace: Application -->
