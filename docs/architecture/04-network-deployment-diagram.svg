  <text x="995" y="1060" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Files • Models • Backups</text>

  <rect x="1140" y="1025" width="230" height="45" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="1255" y="1045" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Elasticsearch (OpenSearch)</text>
  <text x="1255" y="1060" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">3-node cluster • Logs</text>

  <!-- Security Group Labels -->
  <text x="1400" y="1025" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#e74c3c">🔒 Security</text>
  <text x="1400" y="1042" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">• VPC Isolation</text>
  <text x="1400" y="1057" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">• Security Groups</text>
  <text x="1400" y="1072" font-family="Arial, sans-serif" font-size="8" fill="#e74c3c">• Private Subnets</text>

  <!-- Connection lines -->
