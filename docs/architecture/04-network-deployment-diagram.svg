  <text x="100" y="1010" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">💾 Data Layer - Managed Services (Multi-AZ)</text>

  <rect x="100" y="1025" width="230" height="45" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
