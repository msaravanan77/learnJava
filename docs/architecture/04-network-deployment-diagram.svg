  <text x="210" y="610" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">API Gateway</text>
  <text x="210" y="630" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Pod: 3 replicas</text>
  <text x="210" y="645" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">CPU: 1 core</text>
  <text x="210" y="660" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">RAM: 2 GB</text>
  <text x="210" y="675" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Port: 8080</text>
  <text x="210" y="690" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Service: ClusterIP</text>

  <rect x="300" y="590" width="140" height="110" fill="#27ae60" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="370" y="610" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Search Service</text>
  <text x="370" y="630" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Pod: 3 replicas</text>
  <text x="370" y="645" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">CPU: 2 cores</text>
  <text x="370" y="660" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">RAM: 4 GB</text>
  <text x="370" y="675" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Port: 8001</text>
  <text x="370" y="690" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">HPA: 3-10 pods</text>

