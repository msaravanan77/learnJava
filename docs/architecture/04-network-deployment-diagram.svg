  <text x="530" y="630" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Pod: 2 replicas</text>
  <text x="530" y="645" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">CPU: 1 core</text>
  <text x="530" y="660" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">RAM: 2 GB</text>
  <text x="530" y="675" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Port: 8003</text>
  <text x="530" y="690" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Service: ClusterIP</text>

