  <text x="215" y="1060" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">db.r5.large • Primary + Standby</text>

  <rect x="360" y="1025" width="230" height="45" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="475" y="1045" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">ElastiCache Redis (Cluster)</text>
  <text x="475" y="1060" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">cache.r5.large • 3 nodes</text>

  <rect x="620" y="1025" width="230" height="45" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
  <text x="735" y="1045" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="white">Qdrant Cloud (Managed)</text>
  <text x="735" y="1060" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">100M vectors • HA cluster</text>

  <rect x="880" y="1025" width="230" height="45" fill="#f39c12" stroke="#2c3e50" stroke-width="1" rx="3"/>
