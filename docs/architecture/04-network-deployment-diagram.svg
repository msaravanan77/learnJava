  <text x="680" y="630" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Pod: 2</text>
  <text x="680" y="645" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">CPU: 2</text>
  <text x="680" y="660" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">RAM: 4 GB</text>
  <text x="680" y="675" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">Port: 8004</text>
  <text x="680" y="690" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="white">ClusterIP</text>

