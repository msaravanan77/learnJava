  </text>

  <!-- Filter Manager Callbacks -->
  <rect x="150" y="625" width="250" height="140" fill="#E74C3C" stroke="#C0392B" stroke-width="2" rx="5"/>
  <text x="275" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    Filter Manager Callbacks
  </text>
  <text x="275" y="670" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
