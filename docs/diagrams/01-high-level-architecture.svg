  </text>

  <!-- User Mode Section -->
  <rect x="50" y="60" width="1300" height="380" fill="#E8F4F8" stroke="#2980B9" stroke-width="3" rx="10"/>
  <text x="70" y="90" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2980B9">
    USER MODE (Ring 3)
  </text>

  <!-- Management Layer -->
  <rect x="100" y="110" width="1200" height="100" fill="#FFFFFF" stroke="#34495E" stroke-width="2" rx="8"/>
  <text x="680" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495E">
