  </text>

  <!-- Event Viewer -->
  <rect x="610" y="150" width="180" height="50" fill="#16A085" stroke="#138D75" stroke-width="2" rx="5"/>
  <text x="700" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
