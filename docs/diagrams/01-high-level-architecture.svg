  </text>
  <text x="575" y="687" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • PsSetCreateThread
  </text>
  <text x="575" y="704" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • PsSetLoadImage
  </text>
  <text x="575" y="721" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • Command Line Capture
  </text>
  <text x="575" y="738" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • User Context
  </text>
  <text x="575" y="755" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
