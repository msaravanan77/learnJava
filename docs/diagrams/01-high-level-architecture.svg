  </text>

  <!-- Mini-Filter Driver -->
  <rect x="100" y="580" width="1200" height="350" fill="#FFFFFF" stroke="#34495E" stroke-width="2" rx="8"/>
  <text x="680" y="605" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495E">
