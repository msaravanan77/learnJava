  </text>

  <!-- JSON Logger -->
  <rect x="650" y="280" width="200" height="120" fill="#F39C12" stroke="#E67E22" stroke-width="2" rx="5"/>
  <text x="750" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
