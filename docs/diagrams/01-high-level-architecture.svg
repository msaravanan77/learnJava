  </text>
  <text x="275" y="687" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • PreWrite
  </text>
  <text x="275" y="704" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
