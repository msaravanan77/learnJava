  </text>
  <text x="275" y="738" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • Context Tracking
  </text>
  <text x="275" y="755" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    Altitude: 325100
  </text>

  <!-- Process Monitor -->
  <rect x="450" y="625" width="250" height="140" fill="#3498DB" stroke="#2980B9" stroke-width="2" rx="5"/>
  <text x="575" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    Process Monitor
  </text>
  <text x="575" y="670" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
