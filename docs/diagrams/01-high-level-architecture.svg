  </text>

  <!-- Configuration UI -->
  <rect x="840" y="150" width="180" height="50" fill="#E67E22" stroke="#D35400" stroke-width="2" rx="5"/>
  <text x="930" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
