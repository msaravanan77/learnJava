  </text>

  <!-- Kernel Mode Section -->
  <rect x="50" y="530" width="1300" height="420" fill="#FFE6E6" stroke="#C0392B" stroke-width="3" rx="10"/>
  <text x="70" y="560" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#C0392B">
