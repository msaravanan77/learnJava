  <rect x="1100" y="280" width="150" height="120" fill="#E74C3C" stroke="#C0392B" stroke-width="2" rx="5"/>
  <text x="1175" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
