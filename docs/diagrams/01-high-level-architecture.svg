  </text>

  <!-- Network Monitor -->
  <rect x="750" y="625" width="250" height="140" fill="#16A085" stroke="#138D75" stroke-width="2" rx="5"/>
  <text x="875" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    Network Monitor (WFP)
  </text>
  <text x="875" y="670" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
