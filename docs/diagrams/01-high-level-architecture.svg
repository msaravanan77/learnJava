  </text>

  <!-- EDR Service -->
  <rect x="100" y="240" width="1200" height="180" fill="#FFFFFF" stroke="#34495E" stroke-width="2" rx="8"/>
  <text x="680" y="265" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#34495E">
    YourEDR Service (Windows Service)
  </text>

  <!-- Driver Communicator -->
  <rect x="150" y="280" width="200" height="120" fill="#3498DB" stroke="#2980B9" stroke-width="2" rx="5"/>
  <text x="250" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
