  </text>

  <!-- Event Processor -->
  <rect x="400" y="280" width="200" height="120" fill="#2ECC71" stroke="#27AE60" stroke-width="2" rx="5"/>
  <text x="500" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    Event Processor
  </text>
  <text x="500" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
