  </text>

  <!-- Config Manager -->
  <rect x="900" y="280" width="150" height="120" fill="#9B59B6" stroke="#8E44AD" stroke-width="2" rx="5"/>
  <text x="975" y="305" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    Config Manager
  </text>
  <text x="975" y="325" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
