  </text>
  <text x="875" y="687" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • ALE_AUTH_CONNECT
  </text>
  <text x="875" y="704" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • TCP/UDP Monitoring
  </text>
  <text x="875" y="721" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • IP/Port Capture
  </text>
  <text x="875" y="738" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • Process Association
  </text>
  <text x="875" y="755" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • Flow Tracking
  </text>

  <!-- Communication Port -->
  <rect x="1050" y="625" width="200" height="70" fill="#F39C12" stroke="#E67E22" stroke-width="2" rx="5"/>
  <text x="1150" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    Communication Port
  </text>
  <text x="1150" y="670" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • FltMgr Port
  </text>
  <text x="1150" y="687" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • IOCTL Dispatch
  </text>

  <!-- Event Logger -->
  <rect x="1050" y="715" width="200" height="50" fill="#9B59B6" stroke="#8E44AD" stroke-width="2" rx="5"/>
  <text x="1150" y="740" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    Event Queuing
  </text>
  <text x="1150" y="757" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • Ring Buffer
  </text>

  <!-- Ring Buffer -->
  <rect x="150" y="795" width="850" height="120" fill="#ECF0F1" stroke="#34495E" stroke-width="2" rx="5"/>
  <text x="575" y="820" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#34495E">
    Lock-Free Ring Buffer (2MB Circular)
  </text>
  <text x="575" y="840" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#34495E">
    [Write Ptr] ───► [Event Queue] ───► [Read Ptr]
  </text>
  <text x="575" y="860" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7F8C8D">
    • Atomic Operations • Overflow Protection • Event Notification
  </text>
  <text x="575" y="877" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7F8C8D">
    • Process Events • File Events • Network Events • Image Load Events
  </text>
  <text x="575" y="894" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#7F8C8D">
    Drop Policy: Oldest First | Performance: &lt;1μs write latency
  </text>

  <!-- Storage -->
  <rect x="1050" y="795" width="200" height="120" fill="#2ECC71" stroke="#27AE60" stroke-width="2" rx="5"/>
  <text x="1150" y="820" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
    JSONL Storage
  </text>
  <text x="1150" y="840" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    C:\ProgramData\
  </text>
  <text x="1150" y="857" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    YourEDR\Logs\
  </text>
  <text x="1150" y="874" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • 100MB/file
  </text>
  <text x="1150" y="891" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • Time rotation
  </text>
  <text x="1150" y="908" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#FFFFFF">
    • 7 day retention
  </text>

  <!-- Arrows -->
  <!-- Management to Service -->
  <path d="M 700 210 L 700 240" stroke="#34495E" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Service to Communication Channel -->
  <path d="M 250 400 L 250 430 L 430 430 L 430 460" stroke="#34495E" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 500 400 L 500 430 L 550 430 L 550 460" stroke="#34495E" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 750 400 L 750 430 L 700 430 L 700 460" stroke="#34495E" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Communication Channel to Driver -->
  <path d="M 700 500 L 700 580" stroke="#34495E" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Driver components to Ring Buffer -->
  <path d="M 275 765 L 275 795" stroke="#34495E" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 575 765 L 575 795" stroke="#34495E" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 875 765 L 875 795" stroke="#34495E" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Ring Buffer to Storage -->
  <path d="M 1000 855 L 1050 855" stroke="#34495E" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- Legend -->
  <rect x="50" y="960" width="450" height="30" fill="#FFFFFF" stroke="#34495E" stroke-width="1" rx="3"/>
  <text x="60" y="980" font-family="Arial, sans-serif" font-size="11" fill="#34495E">
    Legend: Blue=Communication | Green=Processing | Orange=Storage | Red=Monitoring | Purple=Config
  </text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#34495E"/>
    </marker>
  </defs>
</svg>
