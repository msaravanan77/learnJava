  </text>

  <!-- PowerShell Module -->
  <rect x="150" y="150" width="180" height="50" fill="#3498DB" stroke="#2980B9" stroke-width="2" rx="5"/>
  <text x="240" y="180" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
