  </text>

  <!-- Web API -->
  <rect x="380" y="150" width="180" height="50" fill="#9B59B6" stroke="#8E44AD" stroke-width="2" rx="5"/>
  <text x="470" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
