  </text>

  <!-- Communication Channel -->
  <rect x="400" y="460" width="600" height="40" fill="#34495E" stroke="#2C3E50" stroke-width="2" rx="5"/>
  <text x="700" y="485" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
