<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1100">
  <rect fill="#fafafa" width="1400" height="1100"/>

  <!-- Title -->
  <text x="700" y="40" style="font: bold 32px sans-serif; fill: #1a1a1a;" text-anchor="middle">QA Model Architecture - Neural Network Detail</text>
  <text x="700" y="70" style="font: 16px sans-serif; fill: #666;" text-anchor="middle">BERT-style encoder with span prediction heads</text>

  <!-- Input Example -->
  <g transform="translate(50, 100)">
    <rect fill="#e3f2fd" x="0" y="0" width="1300" height="80" rx="8" stroke="#2196f3" stroke-width="2"/>
    <text x="650" y="30" style="font: bold 14px sans-serif; fill: #1976d2;" text-anchor="middle">INPUT SEQUENCE (after tokenization)</text>
    <text x="20" y="55" style="font: 11px monospace;">[CLS] what is attention [SEP] attention allows models to focus on relevant parts [SEP]</text>
    <text x="650" y="72" style="font: 9px sans-serif; fill: #666;" text-anchor="middle">Token IDs: [101, 2054, 2003, 3086, 102, 3086, 4473, 4275, 2000, 3579, 2006, 7882, 3033, 102] (seq_len = 14)</text>
  </g>

  <!-- Embedding Layer -->
  <g transform="translate(50, 210)">
    <rect fill="#fff3e0" x="0" y="0" width="1300" height="150" rx="8" stroke="#f9a825" stroke-width="3"/>
    <text x="650" y="30" style="font: bold 16px sans-serif; fill: #f57f17;" text-anchor="middle">EMBEDDING LAYER</text>

    <g transform="translate(50, 50)">
      <rect fill="#fff9c4" x="0" y="0" width="350" height="80" rx="6" stroke="#fbc02d" stroke-width="2"/>
      <text x="175" y="25" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">Token Embeddings</text>
      <text x="20" y="45" style="font: 10px sans-serif;">Vocab size: 30,522</text>
      <text x="20" y="62" style="font: 10px sans-serif;">Embedding dim: 768</text>
      <text x="175" y="78" style="font: 9px monospace; fill: #f57f17;" text-anchor="middle">(seq_len, 768)</text>
    </g>

    <g transform="translate(450, 50)">
      <rect fill="#fff9c4" x="0" y="0" width="350" height="80" rx="6" stroke="#fbc02d" stroke-width="2"/>
      <text x="175" y="25" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">Position Embeddings</text>
      <text x="20" y="45" style="font: 10px sans-serif;">Max positions: 512</text>
      <text x="20" y="62" style="font: 10px sans-serif;">Learned embeddings</text>
      <text x="175" y="78" style="font: 9px monospace; fill: #f57f17;" text-anchor="middle">(seq_len, 768)</text>
    </g>

    <g transform="translate(850, 50)">
      <rect fill="#fff9c4" x="0" y="0" width="350" height="80" rx="6" stroke="#fbc02d" stroke-width="2"/>
      <text x="175" y="25" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">Segment Embeddings</text>
      <text x="20" y="45" style="font: 10px sans-serif;">2 segments: Q vs Doc</text>
      <text x="20" y="62" style="font: 10px sans-serif;">0 for Q, 1 for Doc</text>
      <text x="175" y="78" style="font: 9px monospace; fill: #f57f17;" text-anchor="middle">(seq_len, 768)</text>
    </g>

    <text x="650" y="145" style="font: 11px sans-serif; fill: #f57f17; font-weight: bold;" text-anchor="middle">Sum all three → (batch, seq_len, 768)</text>
  </g>

  <!-- Transformer Encoder Blocks -->
  <g transform="translate(50, 390)">
    <rect fill="#e8f5e9" x="0" y="0" width="1300" height="420" rx="8" stroke="#4caf50" stroke-width="3"/>
    <text x="650" y="30" style="font: bold 16px sans-serif; fill: #2e7d32;" text-anchor="middle">12 TRANSFORMER ENCODER BLOCKS (stacked)</text>

    <!-- Single block detail -->
    <g transform="translate(50, 50)">
      <rect fill="#c8e6c9" x="0" y="0" width="1200" height="340" rx="6" stroke="#66bb6a" stroke-width="2"/>
      <text x="600" y="25" style="font: 13px sans-serif; font-weight: bold; fill: #2e7d32;" text-anchor="middle">Single Encoder Block (repeated 12 times)</text>

      <!-- Multi-head attention -->
      <g transform="translate(30, 40)">
        <rect fill="#a5d6a7" x="0" y="0" width="1140" height="100" rx="6" stroke="#4caf50" stroke-width="2"/>
        <text x="570" y="25" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">Multi-Head Self-Attention (12 heads)</text>

        <g transform="translate(20, 35)">
          <rect fill="#fff" x="0" y="0" width="260" height="55" rx="4" stroke="#66bb6a"/>
          <text x="130" y="20" style="font: 10px sans-serif;" text-anchor="middle">Q = Linear(x)</text>
          <text x="130" y="35" style="font: 9px sans-serif; fill: #666;" text-anchor="middle">(batch, seq, 768)</text>
          <text x="130" y="50" style="font: 9px sans-serif; fill: #666;" text-anchor="middle">→ (batch, 12, seq, 64)</text>
        </g>

        <g transform="translate(300, 35)">
          <rect fill="#fff" x="0" y="0" width="260" height="55" rx="4" stroke="#66bb6a"/>
          <text x="130" y="20" style="font: 10px sans-serif;" text-anchor="middle">K = Linear(x)</text>
          <text x="130" y="35" style="font: 9px sans-serif; fill: #666;" text-anchor="middle">(batch, seq, 768)</text>
          <text x="130" y="50" style="font: 9px sans-serif; fill: #666;" text-anchor="middle">→ (batch, 12, seq, 64)</text>
        </g>

        <g transform="translate(580, 35)">
          <rect fill="#fff" x="0" y="0" width="260" height="55" rx="4" stroke="#66bb6a"/>
          <text x="130" y="20" style="font: 10px sans-serif;" text-anchor="middle">V = Linear(x)</text>
          <text x="130" y="35" style="font: 9px sans-serif; fill: #666;" text-anchor="middle">(batch, seq, 768)</text>
          <text x="130" y="50" style="font: 9px sans-serif; fill: #666;" text-anchor="middle">→ (batch, 12, seq, 64)</text>
        </g>

        <g transform="translate(860, 35)">
          <rect fill="#fff" x="0" y="0" width="260" height="55" rx="4" stroke="#66bb6a"/>
          <text x="130" y="20" style="font: 10px sans-serif;" text-anchor="middle">Attention + Concat</text>
          <text x="130" y="35" style="font: 9px sans-serif; fill: #666;" text-anchor="middle">Softmax(QK^T/√64)V</text>
          <text x="130" y="50" style="font: 9px sans-serif; fill: #666;" text-anchor="middle">→ (batch, seq, 768)</text>
        </g>
      </g>

      <!-- Add & Norm 1 -->
      <g transform="translate(30, 155)">
        <rect fill="#a5d6a7" x="0" y="0" width="1140" height="50" rx="6" stroke="#4caf50" stroke-width="2"/>
        <text x="570" y="25" style="font: 11px sans-serif; font-weight: bold;" text-anchor="middle">Add & LayerNorm</text>
        <text x="570" y="42" style="font: 9px monospace; fill: #2e7d32;" text-anchor="middle">output = LayerNorm(x + attention_output)</text>
      </g>

      <!-- Feed Forward -->
      <g transform="translate(30, 220)">
        <rect fill="#a5d6a7" x="0" y="0" width="1140" height="60" rx="6" stroke="#4caf50" stroke-width="2"/>
        <text x="570" y="25" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">Feed-Forward Network</text>
        <text x="570" y="42" style="font: 10px monospace; fill: #2e7d32;" text-anchor="middle">FFN(x) = Linear₂(ReLU(Linear₁(x)))</text>
        <text x="570" y="57" style="font: 9px sans-serif; fill: #666;" text-anchor="middle">(batch, seq, 768) → (batch, seq, 3072) → (batch, seq, 768)</text>
      </g>

      <!-- Add & Norm 2 -->
      <g transform="translate(30, 295)">
        <rect fill="#a5d6a7" x="0" y="0" width="1140" height="35" rx="6" stroke="#4caf50" stroke-width="2"/>
        <text x="570" y="24" style="font: 10px monospace; fill: #2e7d32;" text-anchor="middle">output = LayerNorm(x + ffn_output)</text>
      </g>
    </g>

    <text x="650" y="410" style="font: 11px sans-serif; fill: #1976d2; font-weight: bold;" text-anchor="middle">Output: (batch, seq_len, 768) - Ready for answer extraction!</text>
  </g>

  <!-- Answer Extraction Heads -->
  <g transform="translate(50, 840)">
    <rect fill="#f3e5f5" x="0" y="0" width="1300" height="180" rx="8" stroke="#9c27b0" stroke-width="3"/>
    <text x="650" y="30" style="font: bold 16px sans-serif; fill: #7b1fa2;" text-anchor="middle">ANSWER SPAN PREDICTION HEADS</text>

    <g transform="translate(100, 50)">
      <rect fill="#e1bee7" x="0" y="0" width="500" height="100" rx="6" stroke="#ba68c8" stroke-width="2"/>
      <text x="250" y="25" style="font: 13px sans-serif; font-weight: bold;" text-anchor="middle">Start Position Classifier</text>
      <text x="250" y="48" style="font: 11px monospace; fill: #7b1fa2;" text-anchor="middle">Linear: (768) → (1)</text>
      <text x="30" y="70" style="font: 10px sans-serif;">Input: encoder_output (batch, seq_len, 768)</text>
      <text x="30" y="88" style="font: 10px sans-serif;">Output: start_logits (batch, seq_len)</text>
    </g>

    <g transform="translate(700, 50)">
      <rect fill="#e1bee7" x="0" y="0" width="500" height="100" rx="6" stroke="#ba68c8" stroke-width="2"/>
      <text x="250" y="25" style="font: 13px sans-serif; font-weight: bold;" text-anchor="middle">End Position Classifier</text>
      <text x="250" y="48" style="font: 11px monospace; fill: #7b1fa2;" text-anchor="middle">Linear: (768) → (1)</text>
      <text x="30" y="70" style="font: 10px sans-serif;">Input: encoder_output (batch, seq_len, 768)</text>
      <text x="30" y="88" style="font: 10px sans-serif;">Output: end_logits (batch, seq_len)</text>
    </g>

    <text x="650" y="170" style="font: 10px sans-serif; fill: #7b1fa2; font-weight: bold;" text-anchor="middle">Apply softmax → Get positions with highest probabilities → Extract span</text>
  </g>

  <!-- Parameter count -->
  <g transform="translate(50, 1030)">
    <rect fill="#fff" x="0" y="0" width="1300" height="60" rx="6" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="650" y="25" style="font: 13px sans-serif; font-weight: bold; fill: #333;" text-anchor="middle">📊 PARAMETER COUNT</text>
    <text x="100" y="48" style="font: 11px sans-serif;">Embeddings: 23.8M</text>
    <text x="350" y="48" style="font: 11px sans-serif;">12 Encoder Blocks: 85M</text>
    <text x="650" y="48" style="font: 11px sans-serif;">QA Heads: 1.5K</text>
    <text x="900" y="48" style="font: 11px sans-serif; font-weight: bold; fill: #1976d2;">TOTAL: ~110M parameters</text>
  </g>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <path d="M 700 180 L 700 210" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 700 360 L 700 390" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 700 810 L 700 840" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 700 1020 L 700 1030" stroke="#333" stroke-width="3" marker-end="url(#arrow)"/>
</svg>