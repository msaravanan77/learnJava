<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900">
  <rect fill="#fafafa" width="1400" height="900"/>

  <!-- Title -->
  <text x="700" y="40" style="font: bold 32px sans-serif; fill: #1a1a1a;" text-anchor="middle">Question Answering System Architecture</text>
  <text x="700" y="70" style="font: 16px sans-serif; fill: #666;" text-anchor="middle">Complete end-to-end system using transformer-based encoders</text>

  <!-- Layer 1: Input -->
  <rect fill="#e3f2fd" x="50" y="110" width="1300" height="120" rx="10" stroke="#2196f3" stroke-width="3"/>
  <text x="700" y="145" style="font: bold 20px sans-serif; fill: #1976d2;" text-anchor="middle">1. INPUT LAYER</text>

  <rect fill="#fff" x="100" y="165" width="550" height="50" rx="6" stroke="#64b5f6" stroke-width="2"/>
  <text x="130" y="195" style="font: 14px sans-serif; font-weight: bold;">📄 Documents (Knowledge Base)</text>
  <text x="150" y="210" style="font: 11px sans-serif; fill: #666;">PDF, TXT, Markdown files</text>

  <rect fill="#fff" x="750" y="165" width="550" height="50" rx="6" stroke="#64b5f6" stroke-width="2"/>
  <text x="780" y="195" style="font: 14px sans-serif; font-weight: bold;">❓ User Question</text>
  <text x="800" y="210" style="font: 11px sans-serif; fill: #666;">"What is attention mechanism?"</text>

  <!-- Layer 2: Processing -->
  <rect fill="#fff3e0" x="50" y="260" width="1300" height="150" rx="10" stroke="#f9a825" stroke-width="3"/>
  <text x="700" y="295" style="font: bold 20px sans-serif; fill: #f57f17;" text-anchor="middle">2. PROCESSING LAYER</text>

  <g transform="translate(100, 315)">
    <rect fill="#fff9c4" x="0" y="0" width="280" height="80" rx="6" stroke="#fbc02d" stroke-width="2"/>
    <text x="140" y="25" style="font: 13px sans-serif; font-weight: bold;" text-anchor="middle">Document Processor</text>
    <text x="20" y="45" style="font: 10px sans-serif;">• Text extraction</text>
    <text x="20" y="60" style="font: 10px sans-serif;">• Chunking (512 tokens)</text>
    <text x="20" y="75" style="font: 10px sans-serif;">• Tokenization</text>
  </g>

  <g transform="translate(420, 315)">
    <rect fill="#fff9c4" x="0" y="0" width="280" height="80" rx="6" stroke="#fbc02d" stroke-width="2"/>
    <text x="140" y="25" style="font: 13px sans-serif; font-weight: bold;" text-anchor="middle">Question Processor</text>
    <text x="20" y="45" style="font: 10px sans-serif;">• Clean & normalize</text>
    <text x="20" y="60" style="font: 10px sans-serif;">• Tokenization</text>
    <text x="20" y="75" style="font: 10px sans-serif;">• Add special tokens</text>
  </g>

  <g transform="translate(740, 315)">
    <rect fill="#fff9c4" x="0" y="0" width="280" height="80" rx="6" stroke="#fbc02d" stroke-width="2"/>
    <text x="140" y="25" style="font: 13px sans-serif; font-weight: bold;" text-anchor="middle">Context Matcher</text>
    <text x="20" y="45" style="font: 10px sans-serif;">• Find relevant chunks</text>
    <text x="20" y="60" style="font: 10px sans-serif;">• Keyword matching</text>
    <text x="20" y="75" style="font: 10px sans-serif;">• Rank by relevance</text>
  </g>

  <g transform="translate(1060, 315)">
    <rect fill="#fff9c4" x="0" y="0" width="240" height="80" rx="6" stroke="#fbc02d" stroke-width="2"/>
    <text x="120" y="25" style="font: 13px sans-serif; font-weight: bold;" text-anchor="middle">Pair Formation</text>
    <text x="20" y="45" style="font: 10px sans-serif;">• [CLS] Q [SEP] Doc</text>
    <text x="20" y="60" style="font: 10px sans-serif;">• Create input pairs</text>
    <text x="20" y="75" style="font: 10px sans-serif;">• Prepare for encoder</text>
  </g>

  <!-- Layer 3: Model -->
  <rect fill="#e8f5e9" x="50" y="440" width="1300" height="180" rx="10" stroke="#4caf50" stroke-width="3"/>
  <text x="700" y="475" style="font: bold 20px sans-serif; fill: #2e7d32;" text-anchor="middle">3. TRANSFORMER ENCODER (BERT-style)</text>

  <g transform="translate(150, 495)">
    <rect fill="#c8e6c9" x="0" y="0" width="220" height="100" rx="6" stroke="#66bb6a" stroke-width="2"/>
    <text x="110" y="25" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">Embedding Layer</text>
    <text x="20" y="45" style="font: 9px sans-serif;">Token Embeddings +</text>
    <text x="20" y="60" style="font: 9px sans-serif;">Position Embeddings +</text>
    <text x="20" y="75" style="font: 9px sans-serif;">Segment Embeddings</text>
    <text x="110" y="92" style="font: 8px sans-serif; fill: #2e7d32;" text-anchor="middle">(batch, seq_len, 768)</text>
  </g>

  <g transform="translate(420, 495)">
    <rect fill="#c8e6c9" x="0" y="0" width="240" height="100" rx="6" stroke="#66bb6a" stroke-width="2"/>
    <text x="120" y="25" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">Transformer Blocks</text>
    <text x="20" y="45" style="font: 9px sans-serif;">12 Encoder Layers:</text>
    <text x="30" y="60" style="font: 8px sans-serif;">• Multi-Head Attention</text>
    <text x="30" y="73" style="font: 8px sans-serif;">• Feed Forward</text>
    <text x="30" y="86" style="font: 8px sans-serif;">• Layer Norm + Residual</text>
  </g>

  <g transform="translate(710, 495)">
    <rect fill="#c8e6c9" x="0" y="0" width="240" height="100" rx="6" stroke="#66bb6a" stroke-width="2"/>
    <text x="120" y="25" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">Context Understanding</text>
    <text x="20" y="45" style="font: 9px sans-serif;">Bidirectional attention:</text>
    <text x="20" y="62" style="font: 8px sans-serif;">Each word attends to</text>
    <text x="20" y="75" style="font: 8px sans-serif;">ALL words in question</text>
    <text x="20" y="88" style="font: 8px sans-serif;">AND document</text>
  </g>

  <g transform="translate(1000, 495)">
    <rect fill="#c8e6c9" x="0" y="0" width="240" height="100" rx="6" stroke="#66bb6a" stroke-width="2"/>
    <text x="120" y="25" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">Output</text>
    <text x="20" y="45" style="font: 9px sans-serif;">Contextualized</text>
    <text x="20" y="60" style="font: 9px sans-serif;">embeddings for</text>
    <text x="20" y="75" style="font: 9px sans-serif;">every token</text>
    <text x="120" y="92" style="font: 8px sans-serif; fill: #2e7d32;" text-anchor="middle">(batch, seq_len, 768)</text>
  </g>

  <!-- Layer 4: Answer Extraction -->
  <rect fill="#f3e5f5" x="50" y="650" width="1300" height="120" rx="10" stroke="#9c27b0" stroke-width="3"/>
  <text x="700" y="685" style="font: bold 20px sans-serif; fill: #7b1fa2;" text-anchor="middle">4. ANSWER EXTRACTION LAYER</text>

  <g transform="translate(150, 700)">
    <rect fill="#e1bee7" x="0" y="0" width="280" height="50" rx="6" stroke="#ba68c8" stroke-width="2"/>
    <text x="140" y="22" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">Start Position Classifier</text>
    <text x="140" y="40" style="font: 9px sans-serif;" text-anchor="middle">Linear(768 → 1) + Softmax</text>
  </g>

  <g transform="translate(480, 700)">
    <rect fill="#e1bee7" x="0" y="0" width="280" height="50" rx="6" stroke="#ba68c8" stroke-width="2"/>
    <text x="140" y="22" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">End Position Classifier</text>
    <text x="140" y="40" style="font: 9px sans-serif;" text-anchor="middle">Linear(768 → 1) + Softmax</text>
  </g>

  <g transform="translate(810, 700)">
    <rect fill="#e1bee7" x="0" y="0" width="280" height="50" rx="6" stroke="#ba68c8" stroke-width="2"/>
    <text x="140" y="22" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">Span Extractor</text>
    <text x="140" y="40" style="font: 9px sans-serif;" text-anchor="middle">Extract text[start:end]</text>
  </g>

  <!-- Layer 5: Output -->
  <rect fill="#ffebee" x="50" y="800" width="1300" height="80" rx="10" stroke="#f44336" stroke-width="3"/>
  <text x="700" y="835" style="font: bold 20px sans-serif; fill: #c62828;" text-anchor="middle">5. OUTPUT</text>
  <text x="700" y="862" style="font: 14px sans-serif; fill: #333;" text-anchor="middle">✅ "Attention is a mechanism that allows the model to focus on relevant parts of the input."</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrowblue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2196f3"/>
    </marker>
    <marker id="arroworange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f9a825"/>
    </marker>
    <marker id="arrowgreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#4caf50"/>
    </marker>
    <marker id="arrowpurple" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#9c27b0"/>
    </marker>
  </defs>

  <path d="M 375 230 L 375 260" stroke="#2196f3" stroke-width="3" marker-end="url(#arrowblue)"/>
  <path d="M 1025 230 L 1025 260" stroke="#2196f3" stroke-width="3" marker-end="url(#arrowblue)"/>

  <path d="M 700 410 L 700 440" stroke="#f9a825" stroke-width="3" marker-end="url(#arroworange)"/>

  <path d="M 700 620 L 700 650" stroke="#4caf50" stroke-width="3" marker-end="url(#arrowgreen)"/>

  <path d="M 700 770 L 700 800" stroke="#9c27b0" stroke-width="3" marker-end="url(#arrowpurple)"/>

  <!-- Key metrics -->
  <rect fill="#fff" x="1020" y="120" width="320" height="100" rx="6" stroke="#666" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="1180" y="145" style="font: 12px sans-serif; font-weight: bold; fill: #333;" text-anchor="middle">⚙️ MODEL SPECS</text>
  <text x="1040" y="165" style="font: 10px sans-serif;">Parameters: ~110M (BERT-base)</text>
  <text x="1040" y="182" style="font: 10px sans-serif;">Layers: 12 encoder blocks</text>
  <text x="1040" y="199" style="font: 10px sans-serif;">Hidden size: 768</text>
  <text x="1040" y="216" style="font: 10px sans-serif;">Attention heads: 12</text>
</svg>