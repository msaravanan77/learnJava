name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test-python:
    name: Lint and Test Python Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [indexing-service, embedding-service, search-service, context-engine, llm-service]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('services/${{ matrix.service }}/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd services/${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-cov pylint black

      - name: Run black formatter check
        run: |
          cd services/${{ matrix.service }}
          black --check src/

      - name: Run pylint
        run: |
          cd services/${{ matrix.service }}
          pylint src/ || true

      - name: Run tests
        run: |
          cd services/${{ matrix.service }}
          pytest tests/ --cov=src --cov-report=xml || true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: services/${{ matrix.service }}/coverage.xml
          flags: ${{ matrix.service }}

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test-python
    strategy:
      matrix:
        service: [indexing-service, embedding-service, search-service, context-engine, llm-service, api-gateway]

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          cd services/${{ matrix.service }}
          docker build -t workspace-intelligence/${{ matrix.service }}:${{ github.sha }} .

      - name: Save Docker image
        run: |
          docker save workspace-intelligence/${{ matrix.service }}:${{ github.sha }} > ${{ matrix.service }}.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.service }}-image
          path: ${{ matrix.service }}.tar

  test-vscode-extension:
    name: Test VSCode Extension
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ide-extensions/vscode/package-lock.json

      - name: Install dependencies
        run: |
          cd ide-extensions/vscode
          npm ci

      - name: Run lint
        run: |
          cd ide-extensions/vscode
          npm run lint

      - name: Compile TypeScript
        run: |
          cd ide-extensions/vscode
          npm run compile

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-docker-images

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workspace
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run integration tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest tests/integration/ || true
