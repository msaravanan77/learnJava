<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000">
  <defs>
    <style>
      .title { font: bold 30px sans-serif; fill: #1a1a1a; }
      .subtitle { font: bold 17px sans-serif; fill: #2c3e50; }
      .heading { font: bold 15px sans-serif; fill: #34495e; }
      .text { font: 13px sans-serif; fill: #555; }
      .small-text { font: 11px sans-serif; fill: #666; }
      .tiny-text { font: 9px sans-serif; fill: #777; }
      .code { font: 11px 'Courier New', monospace; fill: #e74c3c; }
      .box-data { fill: #e8f4f8; stroke: #3498db; stroke-width: 2; }
      .box-process { fill: #fef5e7; stroke: #f39c12; stroke-width: 2; }
      .box-model { fill: #fdecea; stroke: #e74c3c; stroke-width: 2; }
      .box-api { fill: #e8f6f3; stroke: #16a085; stroke-width: 2; }
      .box-deploy { fill: #ebf5fb; stroke: #2980b9; stroke-width: 2; }
      .arrow { fill: none; stroke: #7f8c8d; stroke-width: 2.5; marker-end: url(#arrowhead); }
      .arrow-data { fill: none; stroke: #3498db; stroke-width: 2; marker-end: url(#arrowhead-blue); }
      .gradient-bg { fill: url(#grad1); }
    </style>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9fa;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#7f8c8d" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3498db" />
    </marker>
  </defs>

  <rect class="gradient-bg" width="1400" height="1000" />

  <!-- Title -->
  <text x="700" y="35" class="title" text-anchor="middle">Production Recommendation System Architecture</text>
  <text x="700" y="58" class="subtitle" text-anchor="middle">Complete ML Pipeline: From Raw Data to REST API</text>

  <!-- LAYER 1: DATA SOURCES -->
  <text x="700" y="95" class="heading" text-anchor="middle" fill="#3498db">LAYER 1: DATA SOURCES</text>

  <rect class="box-data" x="50" y="105" width="180" height="100" rx="6" />
  <text x="140" y="130" class="text" text-anchor="middle" font-weight="bold">Products</text>
  <text x="140" y="150" class="small-text" text-anchor="middle">products.csv</text>
  <text x="60" y="170" class="tiny-text">• ID, name, category</text>
  <text x="60" y="185" class="tiny-text">• Price, description</text>
  <text x="60" y="200" class="tiny-text">100 items</text>

  <rect class="box-data" x="260" y="105" width="180" height="100" rx="6" />
  <text x="350" y="130" class="text" text-anchor="middle" font-weight="bold">Users</text>
  <text x="350" y="150" class="small-text" text-anchor="middle">users.csv</text>
  <text x="270" y="170" class="tiny-text">• ID, age, location</text>
  <text x="270" y="185" class="tiny-text">• Preferences</text>
  <text x="270" y="200" class="tiny-text">200 users</text>

  <rect class="box-data" x="470" y="105" width="180" height="100" rx="6" />
  <text x="560" y="130" class="text" text-anchor="middle" font-weight="bold">Interactions</text>
  <text x="560" y="150" class="small-text" text-anchor="middle">interactions.csv</text>
  <text x="480" y="170" class="tiny-text">• Views, clicks</text>
  <text x="480" y="185" class="tiny-text">• Add to cart, purchase</text>
  <text x="480" y="200" class="tiny-text">5000+ events</text>

  <rect class="box-data" x="680" y="105" width="180" height="100" rx="6" />
  <text x="770" y="130" class="text" text-anchor="middle" font-weight="bold">Ratings</text>
  <text x="770" y="150" class="small-text" text-anchor="middle">ratings.csv</text>
  <text x="690" y="170" class="tiny-text">• User-item ratings</text>
  <text x="690" y="185" class="tiny-text">• 1.0 to 5.0 scale</text>
  <text x="690" y="200" class="tiny-text">3000+ ratings</text>

  <!-- Arrows down to preprocessing -->
  <path class="arrow-data" d="M 140 210 L 140 240 L 300 240 L 300 265" />
  <path class="arrow-data" d="M 350 210 L 350 265" />
  <path class="arrow-data" d="M 560 210 L 560 240 L 400 240 L 400 265" />
  <path class="arrow-data" d="M 770 210 L 770 240 L 450 240 L 450 265" />

  <!-- LAYER 2: DATA PROCESSING -->
  <text x="700" y="250" class="heading" text-anchor="middle" fill="#f39c12">LAYER 2: DATA PROCESSING</text>

  <rect class="box-process" x="200" y="270" width="300" height="120" rx="6" />
  <text x="350" y="295" class="text" text-anchor="middle" font-weight="bold">Step 1: Data Preparation</text>
  <text x="220" y="315" class="small-text">• Load &amp; merge datasets</text>
  <text x="220" y="333" class="small-text">• Handle missing values</text>
  <text x="220" y="351" class="small-text">• Data validation</text>
  <text x="220" y="369" class="small-text">• Quality checks</text>
  <text x="220" y="385" class="code">step1_data_preparation.py</text>

  <path class="arrow" d="M 505 330 L 545 330" />

  <rect class="box-process" x="550" y="270" width="300" height="120" rx="6" />
  <text x="700" y="295" class="text" text-anchor="middle" font-weight="bold">Step 2: Feature Engineering</text>
  <text x="570" y="315" class="small-text">• User features (history, prefs)</text>
  <text x="570" y="333" class="small-text">• Item features (popularity)</text>
  <text x="570" y="351" class="small-text">• Interaction features</text>
  <text x="570" y="369" class="small-text">• Normalization</text>
  <text x="570" y="385" class="code">step2_feature_engineering.py</text>

  <!-- Arrow down to model training -->
  <path class="arrow" d="M 525 395 L 525 430 L 700 430 L 700 455" />

  <!-- LAYER 3: MODEL TRAINING -->
  <text x="700" y="440" class="heading" text-anchor="middle" fill="#e74c3c">LAYER 3: MODEL TRAINING</text>

  <rect class="box-model" x="150" y="460" width="340" height="140" rx="6" />
  <text x="320" y="485" class="text" text-anchor="middle" font-weight="bold">Step 3: Train Model</text>
  <rect fill="#fff" x="170" y="495" width="300" height="95" rx="4" stroke="#c0392b" />
  <text x="180" y="515" class="small-text" font-weight="bold">Collaborative Filtering:</text>
  <text x="180" y="532" class="tiny-text">• User embeddings (32-dim)</text>
  <text x="180" y="547" class="tiny-text">• Item embeddings (32-dim)</text>
  <text x="180" y="562" class="tiny-text">• Neural network layers</text>
  <text x="180" y="577" class="tiny-text">• Predict ratings/purchases</text>
  <text x="180" y="593" class="code">step3_train_model.py</text>

  <path class="arrow" d="M 495 530 L 545 530" />

  <rect class="box-model" x="550" y="460" width="320" height="140" rx="6" />
  <text x="710" y="485" class="text" text-anchor="middle" font-weight="bold">Step 4: Evaluate Model</text>
  <rect fill="#fff" x="570" y="495" width="280" height="95" rx="4" stroke="#c0392b" />
  <text x="580" y="515" class="small-text" font-weight="bold">Metrics:</text>
  <text x="580" y="532" class="tiny-text">• Precision@10, Recall@10</text>
  <text x="580" y="547" class="tiny-text">• NDCG@10 (ranking quality)</text>
  <text x="580" y="562" class="tiny-text">• Hit Rate, CTR</text>
  <text x="580" y="577" class="tiny-text">• A/B testing setup</text>
  <text x="580" y="593" class="code">step4_evaluate_model.py</text>

  <!-- Model saved -->
  <rect class="box-model" x="900" y="480" width="180" height="80" rx="6" stroke-dasharray="5,5" />
  <text x="990" y="505" class="text" text-anchor="middle" font-weight="bold">Saved Model</text>
  <text x="920" y="525" class="tiny-text">recommendation_model.pth</text>
  <text x="920" y="543" class="tiny-text">✓ User embeddings</text>
  <text x="920" y="558" class="tiny-text">✓ Item embeddings</text>

  <path class="arrow" d="M 870 530 L 895 530" stroke-dasharray="5,5" />

  <!-- Arrow down to API -->
  <path class="arrow" d="M 710 605 L 710 640" />

  <!-- LAYER 4: API & SERVING -->
  <text x="700" y="630" class="heading" text-anchor="middle" fill="#16a085">LAYER 4: API SERVING</text>

  <rect class="box-api" x="250" y="645" width="900" height="130" rx="6" />
  <text x="700" y="670" class="text" text-anchor="middle" font-weight="bold">Step 5: REST API Server (FastAPI)</text>

  <rect fill="#fff" x="280" y="685" width="200" height="75" rx="4" stroke="#138d75" />
  <text x="380" y="705" class="small-text" text-anchor="middle" font-weight="bold">GET /recommend/user/{id}</text>
  <text x="290" y="725" class="tiny-text">Personalized recommendations</text>
  <text x="290" y="742" class="tiny-text">Returns: Top 10 products</text>

  <rect fill="#fff" x="500" y="685" width="200" height="75" rx="4" stroke="#138d75" />
  <text x="600" y="705" class="small-text" text-anchor="middle" font-weight="bold">GET /similar/{product_id}</text>
  <text x="510" y="725" class="tiny-text">Similar products</text>
  <text x="510" y="742" class="tiny-text">Returns: Related items</text>

  <rect fill="#fff" x="720" y="685" width="200" height="75" rx="4" stroke="#138d75" />
  <text x="820" y="705" class="small-text" text-anchor="middle" font-weight="bold">POST /recommend/batch</text>
  <text x="730" y="725" class="tiny-text">Bulk recommendations</text>
  <text x="730" y="742" class="tiny-text">For multiple users</text>

  <rect fill="#fff" x="940" y="685" width="190" height="75" rx="4" stroke="#138d75" />
  <text x="1035" y="705" class="small-text" text-anchor="middle" font-weight="bold">GET /health</text>
  <text x="950" y="725" class="tiny-text">Service health check</text>
  <text x="950" y="742" class="tiny-text">Monitoring</text>

  <text x="280" y="773" class="code">step5_api_server.py</text>

  <!-- Arrow down to deployment -->
  <path class="arrow" d="M 700 780 L 700 810" />

  <!-- LAYER 5: DEPLOYMENT & MONITORING -->
  <text x="700" y="800" class="heading" text-anchor="middle" fill="#2980b9">LAYER 5: PRODUCTION DEPLOYMENT</text>

  <rect class="box-deploy" x="100" y="815" width="280" height="100" rx="6" />
  <text x="240" y="840" class="text" text-anchor="middle" font-weight="bold">Containerization</text>
  <text x="120" y="860" class="small-text">• Docker image</text>
  <text x="120" y="878" class="small-text">• Dependencies packaged</text>
  <text x="120" y="896" class="small-text">• Port 8000 exposed</text>

  <rect class="box-deploy" x="400" y="815" width="280" height="100" rx="6" />
  <text x="540" y="840" class="text" text-anchor="middle" font-weight="bold">Cloud Deployment</text>
  <text x="420" y="860" class="small-text">• AWS / GCP / Azure</text>
  <text x="420" y="878" class="small-text">• Auto-scaling</text>
  <text x="420" y="896" class="small-text">• Load balancing</text>

  <rect class="box-deploy" x="700" y="815" width="280" height="100" rx="6" />
  <text x="840" y="840" class="text" text-anchor="middle" font-weight="bold">Monitoring</text>
  <text x="720" y="860" class="small-text">• Latency tracking (&lt;100ms)</text>
  <text x="720" y="878" class="small-text">• Recommendation quality</text>
  <text x="720" y="896" class="small-text">• Error logging</text>

  <rect class="box-deploy" x="1000" y="815" width="280" height="100" rx="6" />
  <text x="1140" y="840" class="text" text-anchor="middle" font-weight="bold">A/B Testing</text>
  <text x="1020" y="860" class="small-text">• Compare algorithms</text>
  <text x="1020" y="878" class="small-text">• Measure impact</text>
  <text x="1020" y="896" class="small-text">• Business metrics (CTR, revenue)</text>

  <!-- COMPLETE PIPELINE -->
  <rect class="box-process" x="50" y="935" width="1300" height="50" rx="6" stroke="#27ae60" stroke-width="3" />
  <text x="700" y="958" class="text" text-anchor="middle" font-weight="bold">Step 6: Complete Pipeline (End-to-End Automation)</text>
  <text x="700" y="975" class="small-text" text-anchor="middle">step6_complete_pipeline.py - Orchestrates all steps, monitors health, enables retraining</text>

  <!-- Footer -->
  <text x="700" y="995" class="tiny-text" text-anchor="middle" fill="#7f8c8d" font-style="italic">
    Production ML System: Data → Features → Model → API → Deployment → Monitoring
  </text>
</svg>
