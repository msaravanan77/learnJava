<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900"><rect fill="#fafafa" width="1400" height="900"/><text x="700" y="40" style="font: bold 28px sans-serif; fill: #1a1a1a;" text-anchor="middle">Multi-Head Attention: Multiple Parallel Attention Mechanisms</text><text x="700" y="70" style="font: 16px sans-serif; fill: #666;" text-anchor="middle">Why 8-12 heads? Each learns different patterns!</text><rect fill="#e3f2fd" x="100" y="120" width="200" height="600" rx="8" stroke="#2196f3" stroke-width="2"/><text x="200" y="150" style="font: bold 12px sans-serif; fill: #1976d2;" text-anchor="middle">Head 1: Syntax</text><text x="120" y="180" style="font: 10px sans-serif;">Focuses on:</text><text x="130" y="200" style="font: 9px sans-serif;">• Subject-verb</text><text x="130" y="220" style="font: 9px sans-serif;">• Agreement</text><text x="130" y="240" style="font: 9px sans-serif;">• Word order</text><rect fill="#fff3e0" x="350" y="120" width="200" height="600" rx="8" stroke="#ff9800" stroke-width="2"/><text x="450" y="150" style="font: bold 12px sans-serif; fill: #f57c00;" text-anchor="middle">Head 2: Semantics</text><text x="370" y="180" style="font: 10px sans-serif;">Focuses on:</text><text x="380" y="200" style="font: 9px sans-serif;">• Meaning</text><text x="380" y="220" style="font: 9px sans-serif;">• Synonyms</text><text x="380" y="240" style="font: 9px sans-serif;">• Context</text><rect fill="#e8f5e9" x="600" y="120" width="200" height="600" rx="8" stroke="#4caf50" stroke-width="2"/><text x="700" y="150" style="font: bold 12px sans-serif; fill: #388e3c;" text-anchor="middle">Head 3: Position</text><text x="620" y="180" style="font: 10px sans-serif;">Focuses on:</text><text x="630" y="200" style="font: 9px sans-serif;">• Distance</text><text x="630" y="220" style="font: 9px sans-serif;">• Near/far</text><text x="630" y="240" style="font: 9px sans-serif;">• Locality</text><rect fill="#fce4ec" x="850" y="120" width="450" height="600" rx="8" stroke="#e91e63" stroke-width="2"/><text x="1075" y="150" style="font: bold 12px sans-serif; fill: #c2185b;" text-anchor="middle">Concatenate & Project</text><text x="870" y="200" style="font: 11px monospace;">Output = Concat(head₁, head₂, ..., head₈) × W_O</text><text x="870" y="250" style="font: 10px sans-serif;">Each head (dimension d/h):</text><text x="880" y="275" style="font: 9px sans-serif;">• Learns different patterns</text><text x="880" y="295" style="font: 9px sans-serif;">• Parallel computation</text><text x="880" y="315" style="font: 9px sans-serif;">• Richer representations</text><rect fill="#fff9c4" x="870" y="350" width="410" height="100" rx="6" stroke="#f9a825" stroke-width="2"/><text x="1075" y="380" style="font: bold 11px sans-serif; fill: #f57f17;" text-anchor="middle">💡 Why Multiple Heads?</text><text x="880" y="405" style="font: 9px sans-serif;">Single head: One perspective</text><text x="880" y="425" style="font: 9px sans-serif;">Multi-head: Multiple perspectives simultaneously</text><text x="880" y="442" style="font: 9px sans-serif;">→ Richer, more complete understanding!</text><text x="700" y="850" style="font: 12px sans-serif; fill: #666; font-style: italic;" text-anchor="middle">Typical: 8-12 heads in production models (GPT, BERT)</text></svg>
