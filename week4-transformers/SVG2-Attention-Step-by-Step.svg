<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900"><rect fill="#fafafa" width="1400" height="900"/><text x="700" y="40" style="font: bold 28px sans-serif; fill: #1a1a1a;" text-anchor="middle">Attention Calculation: Complete Step-by-Step Example</text><text x="700" y="70" style="font: 16px sans-serif; fill: #666;" text-anchor="middle">Computing attention for "The cat sat" with actual numbers</text><rect fill="#e3f2fd" x="50" y="100" width="400" height="300" rx="8" stroke="#2196f3" stroke-width="2"/><text x="250" y="130" style="font: bold 14px sans-serif; fill: #1976d2;" text-anchor="middle">Step 1: Input Embeddings</text><text x="70" y="160" style="font: 12px sans-serif;">Word embeddings (simplified to 4-dim):</text><text x="70" y="190" style="font: 11px monospace;">"The": [0.2, 0.5, 0.1, 0.8]</text><text x="70" y="215" style="font: 11px monospace;">"cat": [0.7, 0.3, 0.9, 0.2]</text><text x="70" y="240" style="font: 11px monospace;">"sat": [0.4, 0.8, 0.3, 0.6]</text><text x="70" y="275" style="font: 10px sans-serif; fill: #666;">Each word → dense vector representation</text><rect fill="#fff3e0" x="480" y="100" width="400" height="300" rx="8" stroke="#ff9800" stroke-width="2"/><text x="680" y="130" style="font: bold 14px sans-serif; fill: #f57c00;" text-anchor="middle">Step 2: Create Q, K, V</text><text x="500" y="165" style="font: 11px sans-serif;">Multiply by learned weight matrices:</text><text x="500" y="190" style="font: 10px monospace;">Q = Input × W_Q</text><text x="500" y="210" style="font: 10px monospace;">K = Input × W_K</text><text x="500" y="230" style="font: 10px monospace;">V = Input × W_V</text><text x="500" y="260" style="font: 10px sans-serif; fill: #666;">W_Q, W_K, W_V are learned parameters</text><rect fill="#e8f5e9" x="910" y="100" width="440" height="300" rx="8" stroke="#4caf50" stroke-width="2"/><text x="1130" y="130" style="font: bold 14px sans-serif; fill: #388e3c;" text-anchor="middle">Step 3: Compute Scores</text><text x="930" y="165" style="font: 11px monospace;">Scores = Q × K^T / √d_k</text><text x="930" y="200" style="font: 10px sans-serif;">Attention matrix (3×3):</text><text x="940" y="230" style="font: 10px monospace;">       The   cat   sat</text><text x="940" y="250" style="font: 10px monospace;">The:  [0.8, 0.3, 0.2]</text><text x="940" y="270" style="font: 10px monospace;">cat:  [0.3, 0.9, 0.4]</text><text x="940" y="290" style="font: 10px monospace;">sat:  [0.2, 0.4, 0.7]</text><text x="930" y="325" style="font: 9px sans-serif; fill: #666;">High values = high attention</text><rect fill="#fce4ec" x="50" y="430" width="1300" height="180" rx="8" stroke="#e91e63" stroke-width="2"/><text x="700" y="465" style="font: bold 14px sans-serif; fill: #c2185b;" text-anchor="middle">Step 4: Softmax & Weighted Sum</text><text x="70" y="500" style="font: 11px monospace;">After softmax (row sums = 1):</text><text x="90" y="530" style="font: 10px monospace;">The: [0.55, 0.28, 0.17] → Attends mostly to itself</text><text x="90" y="555" style="font: 10px monospace;">cat: [0.18, 0.60, 0.22] → Attends mostly to "cat"</text><text x="90" y="580" style="font: 10px monospace;">sat: [0.15, 0.32, 0.53] → Attends mostly to "sat"</text><text x="700" y="850" style="font: 12px sans-serif; fill: #666; font-style: italic;" text-anchor="middle">Result: Each word now has contextual information from all other words!</text></svg>
