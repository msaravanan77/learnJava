<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000"><rect fill="#fafafa" width="1400" height="1000"/><text x="700" y="40" style="font: bold 30px sans-serif; fill: #1a1a1a;" text-anchor="middle">Encoder Architecture (BERT Style)</text><text x="700" y="70" style="font: 17px sans-serif; fill: #666;" text-anchor="middle">Bidirectional Understanding - Sees ALL words simultaneously</text><rect fill="#e3f2fd" x="100" y="110" width="500" height="750" rx="10" stroke="#2196f3" stroke-width="3"/><text x="350" y="150" style="font: bold 16px sans-serif; fill: #1976d2;" text-anchor="middle">ENCODER STACK</text><rect fill="#fff" x="130" y="180" width="440" height="90" rx="6" stroke="#64b5f6"/><text x="350" y="205" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">Input Embeddings</text><text x="150" y="230" style="font: 10px sans-serif;">Token + Position + Segment</text><text x="150" y="250" style="font: 9px sans-serif; fill: #666;">[CLS] The cat sat [SEP]</text><rect fill="#bbdefb" x="130" y="290" width="440" height="80" rx="6" stroke="#42a5f5" stroke-width="2"/><text x="350" y="320" style="font: 13px sans-serif; font-weight: bold;" text-anchor="middle">Encoder Layer 1</text><text x="150" y="345" style="font: 10px sans-serif;">Multi-Head Self-Attention (bidirectional)</text><text x="150" y="362" style="font: 9px sans-serif; fill: #555;">+ Feed-Forward + LayerNorm</text><rect fill="#90caf9" x="130" y="390" width="440" height="80" rx="6" stroke="#2196f3" stroke-width="2"/><text x="350" y="420" style="font: 13px sans-serif; font-weight: bold;" text-anchor="middle">Encoder Layer 2</text><text x="150" y="445" style="font: 10px sans-serif;">Refines representations</text><rect fill="#64b5f6" x="130" y="490" width="440" height="60" rx="6" stroke="#1e88e5" stroke-width="2"/><text x="350" y="525" style="font: 12px sans-serif; font-weight: bold;" text-anchor="middle">... (12 layers total)</text><rect fill="#42a5f5" x="130" y="570" width="440" height="80" rx="6" stroke="#1976d2" stroke-width="2"/><text x="350" y="600" style="font: 13px sans-serif; font-weight: bold;" text-anchor="middle">Encoder Layer 12</text><text x="150" y="625" style="font: 10px sans-serif;">Final contextualized representations</text><rect fill="#e8f5e9" x="130" y="670" width="440" height="170" rx="8" stroke="#4caf50" stroke-width="2"/><text x="350" y="700" style="font: 13px sans-serif; font-weight: bold; fill: #388e3c;" text-anchor="middle">Outputs (Uses)</text><text x="150" y="730" style="font: 10px sans-serif;">✓ Classification: [CLS] token</text><text x="150" y="750" style="font: 10px sans-serif;">✓ Embeddings: All tokens</text><text x="150" y="770" style="font: 10px sans-serif;">✓ NER: Per-token labels</text><text x="150" y="790" style="font: 10px sans-serif;">✓ Q&A: Span extraction</text><text x="150" y="815" style="font: 9px sans-serif; fill: #666;">Each output has full context!</text><rect fill="#fff" x="650" y="110" width="700" height="750" rx="10" stroke="#424242" stroke-width="2"/><text x="1000" y="150" style="font: bold 16px sans-serif;" text-anchor="middle">KEY CHARACTERISTICS</text><g transform="translate(680, 180)"><circle cx="0" cy="0" r="10" fill="#2196f3"/><text x="25" y="5" style="font: 13px sans-serif; font-weight: bold;">Bidirectional Attention</text><text x="25" y="30" style="font: 10px sans-serif;">Each word sees ALL other words (past and future)</text><text x="25" y="50" style="font: 9px sans-serif; fill: #666;">Example: "bank" in "river bank" vs "bank account"</text><text x="25" y="68" style="font: 9px sans-serif; fill: #666;">Can use both left AND right context</text></g><g transform="translate(680, 270)"><circle cx="0" cy="0" r="10" fill="#ff9800"/><text x="25" y="5" style="font: 13px sans-serif; font-weight: bold;">Special Tokens</text><text x="25" y="30" style="font: 10px sans-serif;">[CLS]: Classification token (sentence representation)</text><text x="25" y="50" style="font: 10px sans-serif;">[SEP]: Separator between segments</text><text x="25" y="70" style="font: 10px sans-serif;">[MASK]: Masked tokens for pre-training</text></g><g transform="translate(680, 360)"><circle cx="0" cy="0" r="10" fill="#4caf50"/><text x="25" y="5" style="font: 13px sans-serif; font-weight: bold;">Pre-training: Masked Language Model</text><text x="25" y="30" style="font: 10px sans-serif;">Input: "The [MASK] sat on the mat"</text><text x="25" y="50" style="font: 10px sans-serif;">Task: Predict [MASK] = "cat"</text><text x="25" y="70" style="font: 9px sans-serif; fill: #666;">Learns to understand context bidirectionally</text></g><g transform="translate(680, 450)"><circle cx="0" cy="0" r="10" fill="#9c27b0"/><text x="25" y="5" style="font: 13px sans-serif; font-weight: bold;">Use Cases</text><text x="25" y="30" style="font: 10px sans-serif;">• Text classification (sentiment, spam)</text><text x="25" y="50" style="font: 10px sans-serif;">• Named entity recognition</text><text x="25" y="70" style="font: 10px sans-serif;">• Question answering</text><text x="25" y="90" style="font: 10px sans-serif;">• Sentence embeddings</text><text x="25" y="110" style="font: 9px sans-serif; fill: #666;">Good for UNDERSTANDING, not generation</text></g><rect fill="#fff3e0" x="680" y="580" width="640" height="260" rx="8" stroke="#f9a825" stroke-width="2"/><text x="1000" y="615" style="font: bold 13px sans-serif; fill: #f57f17;" text-anchor="middle">📊 BERT-BASE SPECIFICATIONS</text><text x="700" y="645" style="font: 10px monospace;">Layers (L): 12</text><text x="700" y="665" style="font: 10px monospace;">Hidden size (d_model): 768</text><text x="700" y="685" style="font: 10px monospace;">Attention heads: 12</text><text x="700" y="705" style="font: 10px monospace;">Parameters: 110M</text><text x="700" y="730" style="font: 10px monospace;">Max sequence length: 512</text><text x="700" y="755" style="font: 10px sans-serif; font-weight: bold;">BERT-LARGE:</text><text x="700" y="775" style="font: 9px monospace;">L=24, H=1024, Heads=16, Params=340M</text><text x="700" y="800" style="font: 9px sans-serif; fill: #666;">Pre-trained on: BookCorpus + Wikipedia</text><text x="700" y="820" style="font: 9px sans-serif; fill: #666;">(3.3B words total)</text><text x="700" y="960" style="font: 12px sans-serif; fill: #666; font-style: italic;" text-anchor="middle">BERT revolutionized NLP by showing bidirectional pre-training works better than left-to-right</text></svg>
