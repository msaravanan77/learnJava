<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000"><rect fill="#fafafa" width="1400" height="1000"/><text x="700" y="35" style="font: bold 28px sans-serif; fill: #1a1a1a;" text-anchor="middle">Complete Transformer Block Architecture</text><text x="700" y="62" style="font: 16px sans-serif; fill: #666;" text-anchor="middle">The building block of GPT, BERT, and all transformer models</text><rect fill="#e3f2fd" x="150" y="100" width="300" height="120" rx="8" stroke="#2196f3" stroke-width="3"/><text x="300" y="130" style="font: bold 14px sans-serif; fill: #1976d2;" text-anchor="middle">Input: Token Embeddings</text><text x="300" y="155" style="font: 11px sans-serif;" text-anchor="middle">+ Positional Encoding</text><text x="170" y="180" style="font: 10px sans-serif;">Shape: (seq_len, d_model)</text><text x="170" y="200" style="font: 9px sans-serif; fill: #666;">Example: (512, 768)</text><path d="M 300 220 L 300 260" stroke="#7f8c8d" stroke-width="3" marker-end="url(#arrow)"/><rect fill="#fff3e0" x="150" y="270" width="300" height="100" rx="8" stroke="#ff9800" stroke-width="3"/><text x="300" y="295" style="font: bold 14px sans-serif; fill: #f57c00;" text-anchor="middle">Multi-Head Attention</text><text x="170" y="320" style="font: 10px sans-serif;">8-12 parallel attention heads</text><text x="170" y="340" style="font: 9px sans-serif;">Self-attention: Q=K=V=Input</text><text x="170" y="357" style="font: 9px sans-serif; fill: #666;">Causal mask for GPT</text><path d="M 300 370 L 300 395" stroke="#7f8c8d" stroke-width="2.5" marker-end="url(#arrow)"/><rect fill="#e8f5e9" x="480" y="270" width="180" height="100" rx="6" stroke="#4caf50" stroke-width="2"/><text x="570" y="295" style="font: 11px sans-serif; fill: #388e3c;" text-anchor="middle">Add & Norm</text><text x="495" y="320" style="font: 9px sans-serif;">Residual: x + Attention(x)</text><text x="495" y="340" style="font: 9px sans-serif;">Layer Normalization</text><text x="495" y="357" style="font: 8px sans-serif; fill: #666;">Stabilizes training</text><path d="M 300 395 L 300 435" stroke="#7f8c8d" stroke-width="3" marker-end="url(#arrow)"/><rect fill="#fff3e0" x="150" y="445" width="300" height="100" rx="8" stroke="#ff9800" stroke-width="3"/><text x="300" y="470" style="font: bold 14px sans-serif; fill: #f57c00;" text-anchor="middle">Feed-Forward Network</text><text x="170" y="495" style="font: 10px sans-serif;">Linear → ReLU → Linear</text><text x="170" y="515" style="font: 9px sans-serif;">d_model → 4×d_model → d_model</text><text x="170" y="532" style="font: 9px sans-serif; fill: #666;">Processes each position independently</text><path d="M 300 545 L 300 570" stroke="#7f8c8d" stroke-width="2.5" marker-end="url(#arrow)"/><rect fill="#e8f5e9" x="480" y="445" width="180" height="100" rx="6" stroke="#4caf50" stroke-width="2"/><text x="570" y="470" style="font: 11px sans-serif; fill: #388e3c;" text-anchor="middle">Add & Norm</text><text x="495" y="495" style="font: 9px sans-serif;">Residual: x + FFN(x)</text><text x="495" y="515" style="font: 9px sans-serif;">Layer Normalization</text><rect fill="#fce4ec" x="150" y="580" width="300" height="80" rx="8" stroke="#e91e63" stroke-width="3"/><text x="300" y="610" style="font: bold 14px sans-serif; fill: #c2185b;" text-anchor="middle">Output</text><text x="300" y="635" style="font: 11px sans-serif;" text-anchor="middle">Contextual Representations</text><text x="170" y="655" style="font: 9px sans-serif; fill: #666;">Ready for next layer or predictions</text><rect fill="#fff9c4" x="700" y="100" width="650" height="560" rx="10" stroke="#f9a825" stroke-width="3"/><text x="1025" y="135" style="font: bold 16px sans-serif; fill: #f57f17;" text-anchor="middle">KEY COMPONENTS EXPLAINED</text><g transform="translate(720, 160)"><circle cx="0" cy="0" r="8" fill="#2196f3"/><text x="20" y="5" style="font: 11px sans-serif; font-weight: bold;">Multi-Head Attention</text><text x="20" y="25" style="font: 9px sans-serif;">• Captures relationships between all tokens</text><text x="20" y="42" style="font: 9px sans-serif;">• Parallel heads = multiple perspectives</text><text x="20" y="59" style="font: 9px sans-serif;">• Core innovation of transformers</text></g><g transform="translate(720, 235)"><circle cx="0" cy="0" r="8" fill="#4caf50"/><text x="20" y="5" style="font: 11px sans-serif; font-weight: bold;">Residual Connections</text><text x="20" y="25" style="font: 9px sans-serif;">• x + f(x) instead of just f(x)</text><text x="20" y="42" style="font: 9px sans-serif;">• Helps gradient flow in deep networks</text><text x="20" y="59" style="font: 9px sans-serif;">• Prevents vanishing gradients</text></g><g transform="translate(720, 310)"><circle cx="0" cy="0" r="8" fill="#ff9800"/><text x="20" y="5" style="font: 11px sans-serif; font-weight: bold;">Layer Normalization</text><text x="20" y="25" style="font: 9px sans-serif;">• Normalizes across features (not batch)</text><text x="20" y="42" style="font: 9px sans-serif;">• Stabilizes training</text><text x="20" y="59" style="font: 9px sans-serif;">• Faster convergence</text></g><g transform="translate(720, 385)"><circle cx="0" cy="0" r="8" fill="#9c27b0"/><text x="20" y="5" style="font: 11px sans-serif; font-weight: bold;">Feed-Forward Network</text><text x="20" y="25" style="font: 9px sans-serif;">• Two linear layers with ReLU</text><text x="20" y="42" style="font: 9px sans-serif;">• Applied to each position separately</text><text x="20" y="59" style="font: 9px sans-serif;">• Expands then compresses (4× then back)</text></g><g transform="translate(720, 460)"><circle cx="0" cy="0" r="8" fill="#e91e63"/><text x="20" y="5" style="font: 11px sans-serif; font-weight: bold;">Stacking Blocks</text><text x="20" y="25" style="font: 9px sans-serif;">• GPT-3: 96 transformer blocks stacked</text><text x="20" y="42" style="font: 9px sans-serif;">• BERT-base: 12 blocks</text><text x="20" y="59" style="font: 9px sans-serif;">• Each block refines representations</text></g><rect fill="#e3f2fd" x="720" y="530" width="610" height="110" rx="6" stroke="#1976d2" stroke-width="2"/><text x="1025" y="560" style="font: 12px sans-serif; fill: #0d47a1; font-weight: bold;" text-anchor="middle">📊 Typical Hyperparameters</text><text x="740" y="585" style="font: 10px monospace;">d_model: 768 (BERT), 1024 (GPT-2)</text><text x="740" y="605" style="font: 10px monospace;">num_heads: 12 (BERT), 16 (GPT-2)</text><text x="740" y="625" style="font: 10px monospace;">d_ff: 3072 (4 × d_model)</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0, 10 3, 0 6" fill="#7f8c8d"/></marker></defs><text x="700" y="950" style="font: 11px sans-serif; fill: #666; font-style: italic;" text-anchor="middle">This single block is repeated 6-96 times in modern transformers (GPT-4: ~100+ layers)</text></svg>
