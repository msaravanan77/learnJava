<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000">
  <rect fill="#fafafa" width="1400" height="1000"/>

  <!-- Title -->
  <text x="700" y="40" style="font: bold 30px sans-serif; fill: #1a1a1a;" text-anchor="middle">GPT Autoregressive Text Generation Process</text>
  <text x="700" y="70" style="font: 17px sans-serif; fill: #666;" text-anchor="middle">How ChatGPT generates text one token at a time</text>

  <!-- Left side: Step-by-step process -->
  <rect fill="#e3f2fd" x="50" y="110" width="850" height="820" rx="10" stroke="#2196f3" stroke-width="3"/>
  <text x="475" y="150" style="font: bold 18px sans-serif; fill: #1976d2;" text-anchor="middle">AUTOREGRESSIVE GENERATION (Step-by-Step)</text>

  <!-- Step 1 -->
  <rect fill="#fff9c4" x="80" y="180" width="790" height="110" rx="8" stroke="#f9a825" stroke-width="2"/>
  <text x="100" y="210" style="font: bold 13px sans-serif; fill: #f57f17;">Step 1: Initial Prompt</text>
  <rect fill="#fff" x="100" y="225" width="750" height="55" rx="4" stroke="#fbc02d"/>
  <text x="120" y="250" style="font: 11px monospace;">Input:  "Once upon a time"</text>
  <text x="120" y="270" style="font: 11px monospace;">Output: "there" (prob: 0.78)</text>
  <text x="650" y="260" style="font: 9px sans-serif; fill: #666;">GPT predicts most likely next word</text>

  <!-- Step 2 -->
  <rect fill="#e1f5fe" x="80" y="310" width="790" height="110" rx="8" stroke="#29b6f6" stroke-width="2"/>
  <text x="100" y="340" style="font: bold 13px sans-serif; fill: #0277bd;">Step 2: Append & Continue</text>
  <rect fill="#fff" x="100" y="355" width="750" height="55" rx="4" stroke="#4fc3f7"/>
  <text x="120" y="380" style="font: 11px monospace;">Input:  "Once upon a time there"</text>
  <text x="120" y="400" style="font: 11px monospace;">Output: "was" (prob: 0.82)</text>
  <text x="650" y="390" style="font: 9px sans-serif; fill: #666;">Previous output becomes input</text>

  <!-- Step 3 -->
  <rect fill="#e8f5e9" x="80" y="440" width="790" height="110" rx="8" stroke="#66bb6a" stroke-width="2"/>
  <text x="100" y="470" style="font: bold 13px sans-serif; fill: #2e7d32;">Step 3: Keep Appending</text>
  <rect fill="#fff" x="100" y="485" width="750" height="55" rx="4" stroke="#81c784"/>
  <text x="120" y="510" style="font: 11px monospace;">Input:  "Once upon a time there was"</text>
  <text x="120" y="530" style="font: 11px monospace;">Output: "a" (prob: 0.91)</text>
  <text x="650" y="520" style="font: 9px sans-serif; fill: #666;">Context grows with each step</text>

  <!-- Step 4 -->
  <rect fill="#fff3e0" x="80" y="570" width="790" height="110" rx="8" stroke="#ffa726" stroke-width="2"/>
  <text x="100" y="600" style="font: bold 13px sans-serif; fill: #e65100;">Step 4: Continue Until Done</text>
  <rect fill="#fff" x="100" y="615" width="750" height="55" rx="4" stroke="#ffb74d"/>
  <text x="120" y="640" style="font: 11px monospace;">Input:  "Once upon a time there was a"</text>
  <text x="120" y="660" style="font: 11px monospace;">Output: "princess" (prob: 0.45)</text>
  <text x="650" y="650" style="font: 9px sans-serif; fill: #666;">Creative choices emerge</text>

  <!-- Step 5 -->
  <rect fill="#f3e5f5" x="80" y="700" width="790" height="110" rx="8" stroke="#ba68c8" stroke-width="2"/>
  <text x="100" y="730" style="font: bold 13px sans-serif; fill: #6a1b9a;">Step 5: ... and so on ...</text>
  <rect fill="#fff" x="100" y="745" width="750" height="55" rx="4" stroke="#ce93d8"/>
  <text x="120" y="770" style="font: 11px monospace;">Input:  "... there was a princess"</text>
  <text x="120" y="790" style="font: 11px monospace;">Output: "who" (prob: 0.67)</text>
  <text x="650" y="780" style="font: 9px sans-serif; fill: #666;">Continues until &lt;END&gt; token</text>

  <text x="475" y="850" style="font: 11px sans-serif; fill: #1976d2; font-weight: bold;" text-anchor="middle">🔄 This is AUTOREGRESSIVE: Output becomes next input</text>
  <text x="475" y="875" style="font: 10px sans-serif; fill: #666;" text-anchor="middle">Each token depends on all previous tokens (but can't see future!)</text>
  <text x="475" y="900" style="font: 10px sans-serif; fill: #e91e63; font-weight: bold;" text-anchor="middle">⚠ Causal Attention Mask prevents looking ahead during training</text>

  <!-- Right side: Technical details -->
  <rect fill="#fce4ec" x="930" y="110" width="420" height="820" rx="10" stroke="#e91e63" stroke-width="3"/>
  <text x="1140" y="150" style="font: bold 16px sans-serif; fill: #c2185b;" text-anchor="middle">TECHNICAL DETAILS</text>

  <!-- Sampling strategies -->
  <g transform="translate(950, 180)">
    <text x="0" y="0" style="font: 13px sans-serif; fill: #c2185b; font-weight: bold;">🎲 SAMPLING STRATEGIES</text>

    <rect fill="#fff" x="0" y="15" width="380" height="95" rx="6" stroke="#f48fb1" stroke-width="2"/>
    <text x="15" y="40" style="font: 11px sans-serif; font-weight: bold;">1. Greedy Decoding</text>
    <text x="25" y="60" style="font: 9px sans-serif;">Always pick highest probability</text>
    <text x="25" y="78" style="font: 8px monospace;">argmax(p(word | context))</text>
    <text x="25" y="96" style="font: 8px sans-serif; fill: #666;">Deterministic but boring</text>

    <rect fill="#fff" x="0" y="125" width="380" height="105" rx="6" stroke="#f48fb1" stroke-width="2"/>
    <text x="15" y="150" style="font: 11px sans-serif; font-weight: bold;">2. Top-k Sampling</text>
    <text x="25" y="170" style="font: 9px sans-serif;">Sample from top k tokens (k=50)</text>
    <text x="25" y="188" style="font: 8px monospace;">sample(top_k_probs)</text>
    <text x="25" y="206" style="font: 8px sans-serif; fill: #666;">More diverse, controlled randomness</text>
    <text x="25" y="221" style="font: 8px sans-serif; fill: #2e7d32;">✓ Good balance</text>

    <rect fill="#fff" x="0" y="245" width="380" height="105" rx="6" stroke="#f48fb1" stroke-width="2"/>
    <text x="15" y="270" style="font: 11px sans-serif; font-weight: bold;">3. Nucleus (Top-p) Sampling</text>
    <text x="25" y="290" style="font: 9px sans-serif;">Sample from smallest set with prob ≥ p</text>
    <text x="25" y="308" style="font: 8px monospace;">cumsum(probs) &gt;= 0.9</text>
    <text x="25" y="326" style="font: 8px sans-serif; fill: #666;">Adaptive: varies # of candidates</text>
    <text x="25" y="341" style="font: 8px sans-serif; fill: #2e7d32;">✓ ChatGPT uses this!</text>

    <rect fill="#fff" x="0" y="365" width="380" height="85" rx="6" stroke="#f48fb1" stroke-width="2"/>
    <text x="15" y="390" style="font: 11px sans-serif; font-weight: bold;">4. Temperature Scaling</text>
    <text x="25" y="410" style="font: 9px sans-serif;">Controls randomness: 0.0 to 2.0</text>
    <text x="25" y="428" style="font: 8px monospace;">probs = softmax(logits / temp)</text>
    <text x="25" y="446" style="font: 8px sans-serif; fill: #666;">Low=focused, High=creative</text>
  </g>

  <!-- KV Cache optimization -->
  <g transform="translate(950, 650)">
    <text x="0" y="0" style="font: 13px sans-serif; fill: #1976d2; font-weight: bold;">⚡ KV CACHE (Speed Trick)</text>

    <rect fill="#e3f2fd" x="0" y="15" width="380" height="110" rx="6" stroke="#2196f3" stroke-width="2"/>
    <text x="15" y="40" style="font: 10px sans-serif; font-weight: bold;">Problem:</text>
    <text x="25" y="58" style="font: 8px sans-serif;">Recompute attention for all previous</text>
    <text x="25" y="74" style="font: 8px sans-serif;">tokens at EVERY step → Slow!</text>

    <text x="15" y="96" style="font: 10px sans-serif; font-weight: bold; fill: #2e7d32;">Solution: Cache K,V vectors</text>
    <text x="25" y="114" style="font: 8px sans-serif;">Only compute for NEW token</text>
  </g>

  <!-- Stop conditions -->
  <g transform="translate(950, 785)">
    <text x="0" y="0" style="font: 13px sans-serif; fill: #f57f17; font-weight: bold;">🛑 STOPPING CONDITIONS</text>

    <rect fill="#fff3e0" x="0" y="15" width="380" height="100" rx="6" stroke="#ffa726" stroke-width="2"/>
    <text x="15" y="40" style="font: 9px sans-serif;">✓ &lt;END&gt; token generated</text>
    <text x="15" y="60" style="font: 9px sans-serif;">✓ Max length reached (2048, 4096)</text>
    <text x="15" y="80" style="font: 9px sans-serif;">✓ User stops generation</text>
    <text x="15" y="100" style="font: 9px sans-serif;">✓ Repetition detected</text>
  </g>

  <!-- Bottom: Comparison -->
  <rect fill="#e8f5e9" x="50" y="950" width="1300" height="40" rx="6" stroke="#4caf50" stroke-width="2"/>
  <text x="700" y="975" style="font: 11px sans-serif; fill: #2e7d32;" text-anchor="middle">💡 Key Insight: Generation is SLOW (sequential) but Training is FAST (parallel) - teacher forcing!</text>
</svg>
