global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'workspace-intelligence'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # API Gateway
  - job_name: 'api-gateway'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - workspace-intelligence
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: api-gateway
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace

  # Search Service
  - job_name: 'search-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - workspace-intelligence
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: search-service

  # Context Engine
  - job_name: 'context-engine'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - workspace-intelligence
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: context-engine

  # LLM Service
  - job_name: 'llm-service'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - workspace-intelligence
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: llm-service

  # ML Services (Indexing, Embedding)
  - job_name: 'ml-services'
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - ml-services
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: keep
        regex: (indexing-service|embedding-service)

  # PostgreSQL Exporter
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Qdrant Metrics
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'
